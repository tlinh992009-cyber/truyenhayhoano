<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện Hay Ho Nở - Đọc & Sáng Tác Truyện Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 onclick="showSection('home')" class="text-2xl font-bold cursor-pointer flex items-center gap-2">
                <i class="fa-solid fa-book-open text-amber-300"></i> Truyện Hay Ho Nở
            </h1>
            <div id="user-nav" class="flex items-center gap-4">
                <!-- Dynamic Nav content via JS -->
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- SECTION: Home / danh sách truyện -->
        <section id="sec-home" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-700 border-l-4 border-indigo-600 pl-3">Khám Phá Truyện</h2>
                <div class="flex gap-2">
                    <select id="sort-filter" onchange="renderStories()" class="px-3 py-1.5 border rounded-lg text-sm bg-white">
                        <option value="newest">Mới nhất</option>
                        <option value="views">Lượt xem nhiều nhất</option>
                        <option value="likes">Yêu thích nhất</option>
                    </select>
                </div>
            </div>
            <div id="story-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Rendered dynamically -->
            </div>
        </section>

        <!-- SECTION: Detail Story -->
        <section id="sec-detail" class="hidden space-y-6">
            <button onclick="showSection('home')" class="text-indigo-600 hover:underline flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <div id="story-detail-content" class="bg-white rounded-xl p-6 shadow-sm">
                <!-- Dynamic Content -->
            </div>
            <!-- Chapter List -->
            <div class="bg-white rounded-xl p-6 shadow-sm space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg">Danh sách chương</h3>
                    <button id="add-chap-btn" onclick="openAddChapterModal()" class="hidden px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm">
                        + Thêm chương
                    </button>
                </div>
                <div id="chapter-list" class="divide-y">
                    <!-- Dynamic Chapters -->
                </div>
            </div>
        </section>

        <!-- SECTION: Read Chapter -->
        <section id="sec-read" class="hidden space-y-6 max-w-3xl mx-auto">
            <button onclick="backToStory()" class="text-indigo-600 hover:underline flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Về chi tiết truyện
            </button>
            <div id="chapter-reader" class="bg-white rounded-xl p-6 shadow-sm space-y-6">
                <!-- Dynamic Content -->
            </div>
            
            <!-- Comment Section -->
            <div class="bg-white rounded-xl p-6 shadow-sm space-y-4">
                <h3 class="font-bold text-lg"><i class="fa-regular fa-comments"></i> Bình luận</h3>
                <div class="flex gap-2">
                    <input type="text" id="comment-input" placeholder="Viết bình luận..." class="flex-grow px-3 py-2 border rounded-lg text-sm">
                    <button onclick="addComment()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">
                        Gửi
                    </button>
                </div>
                <div id="comments-list" class="space-y-3 pt-4 border-t">
                    <!-- Dynamic Comments -->
                </div>
            </div>
        </section>

        <!-- SECTION: Admin Panel -->
        <section id="sec-admin" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-red-600 flex items-center gap-2">
                <i class="fa-solid fa-user-shield"></i> Trang Quản Trị Viên (Admin)
            </h2>
            <div class="bg-white rounded-xl p-6 shadow-sm space-y-4">
                <h3 class="font-bold text-lg border-b pb-2">Quản lý Thành viên</h3>
                <div id="admin-user-list" class="divide-y">
                    <!-- Dynamic User List for Admin -->
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL: Auth (Login/Register) -->
    <div id="modal-auth" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="auth-title" class="font-bold text-lg">Đăng Nhập</h3>
                <button onclick="closeModal('modal-auth')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
                <input type="text" id="auth-username" placeholder="Tên đăng nhập" required class="w-full px-3 py-2 border rounded-lg text-sm">
                <input type="password" id="auth-password" placeholder="Mật khẩu" required class="w-full px-3 py-2 border rounded-lg text-sm">
                <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">
                    Xác nhận
                </button>
            </form>
            <p class="text-xs text-center text-slate-500">
                <span id="auth-toggle-text">Chưa có tài khoản?</span>
                <button onclick="toggleAuthMode()" class="text-indigo-600 font-semibold ml-1" id="auth-toggle-btn">Đăng ký</button>
            </p>
        </div>
    </div>

    <!-- MODAL: Create Story -->
    <div id="modal-story" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg">Đăng Truyện Mới</h3>
                <button onclick="closeModal('modal-story')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleCreateStory(event)" class="space-y-3">
                <input type="text" id="story-title" placeholder="Tên truyện" required class="w-full px-3 py-2 border rounded-lg text-sm">
                <textarea id="story-desc" placeholder="Mô tả ngắn..." required class="w-full px-3 py-2 border rounded-lg text-sm h-24"></textarea>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Ảnh nền (Bìa truyện):</label>
                    <input type="file" id="story-cover" accept="image/*" class="w-full text-sm">
                </div>
                <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">
                    Tạo Truyện
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL: Create Chapter -->
    <div id="modal-chapter" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-lg w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg">Thêm Chương Mới</h3>
                <button onclick="closeModal('modal-chapter')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleCreateChapter(event)" class="space-y-3">
                <input type="text" id="chap-title" placeholder="Tên chương" required class="w-full px-3 py-2 border rounded-lg text-sm">
                <div class="flex gap-4 text-sm">
                    <label class="flex items-center gap-1"><input type="radio" name="chap-type" value="text" checked onclick="toggleChapInput('text')"> Chữ</label>
                    <label class="flex items-center gap-1"><input type="radio" name="chap-type" value="comic" onclick="toggleChapInput('comic')"> Tranh</label>
                    <label class="flex items-center gap-1"><input type="radio" name="chap-type" value="audio" onclick="toggleChapInput('audio')"> Âm thanh</label>
                </div>
                <input type="number" id="chap-price" placeholder="Giá Xu (0 = Miễn phí)" min="0" value="0" class="w-full px-3 py-2 border rounded-lg text-sm">
                
                <div id="input-text-container">
                    <textarea id="chap-content-text" placeholder="Nội dung chương..." class="w-full px-3 py-2 border rounded-lg text-sm h-40"></textarea>
                </div>
                <div id="input-file-container" class="hidden">
                    <input type="file" id="chap-content-file" multiple class="w-full text-sm">
                </div>

                <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">
                    Đăng Chương
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // State management
        let db = {
            users: JSON.parse(localStorage.getItem('thn_users')) || [],
            stories: JSON.parse(localStorage.getItem('thn_stories')) || []
        };
        let currentUser = JSON.parse(localStorage.getItem('thn_currentUser')) || null;
        let activeStoryId = null;
        let activeChapterId = null;
        let isAuthLogin = true;

        // Init Admin Account if not exists
        (function initAdmin() {
            const adminExists = db.users.find(u => u.username === 'quantrithuylinh');
            if (!adminExists) {
                db.users.push({
                    username: 'quantrithuylinh',
                    password: 'Thuylinh99@#',
                    coins: 99999,
                    role: 'admin',
                    banned: false
                });
                saveData();
            }
        })();

        function saveData() {
            localStorage.setItem('thn_users', JSON.stringify(db.users));
            localStorage.setItem('thn_stories', JSON.stringify(db.stories));
            localStorage.setItem('thn_currentUser', JSON.stringify(currentUser));
        }

        // Check Ban status on reload
        if (currentUser) {
            const freshUser = db.users.find(u => u.username === currentUser.username);
            if (freshUser && freshUser.banned) {
                alert('Tài khoản của bạn đã bị cấm truy cập hệ thống!');
                currentUser = null;
                saveData();
            }
        }

        // Navigation
        function updateNav() {
            const nav = document.getElementById('user-nav');
            if (currentUser) {
                const freshUser = db.users.find(u => u.username === currentUser.username) || currentUser;
                nav.innerHTML = `
                    <div class="flex items-center gap-3 text-sm">
                        <span class="bg-amber-400 text-slate-900 px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                            <i class="fa-solid fa-coins"></i> ${freshUser.coins} Xu
                        </span>
                        <button onclick="watchAds()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-1 rounded text-xs font-bold">+ Nhận Xu</button>
                        <span class="font-medium">${freshUser.username} ${freshUser.role === 'admin' ? '<span class="text-xs text-red-300 font-bold">(Admin)</span>' : ''}</span>
                        ${freshUser.role === 'admin' ? '<button onclick="showSection(\'admin\')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Quản Trị</button>' : ''}
                        <button onclick="openModal('modal-story')" class="bg-indigo-500 hover:bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-xs">+ Đăng Truyện</button>
                        <button onclick="logout()" class="text-slate-200 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="openAuthModal(true)" class="bg-white text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-indigo-50">Đăng Nhập</button>
                    <button onclick="openAuthModal(false)" class="bg-indigo-600 text-white border border-white/30 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-indigo-500">Đăng Ký</button>
                `;
            }
        }

        function showSection(sectionId) {
            ['sec-home', 'sec-detail', 'sec-read', 'sec-admin'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('sec-' + sectionId).classList.remove('hidden');
            if (sectionId === 'home') renderStories();
            if (sectionId === 'admin') renderAdminPanel();
        }

        // Render Stories Home
        function renderStories() {
            const grid = document.getElementById('story-grid');
            const sortBy = document.getElementById('sort-filter').value;
            let stories = [...db.stories];

            if (sortBy === 'newest') stories.reverse();
            if (sortBy === 'views') stories.sort((a, b) => b.views - a.views);
            if (sortBy === 'likes') stories.sort((a, b) => b.likes.length - a.likes.length);

            if (stories.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">Chưa có truyện nào. Hãy đăng truyện ngay!</div>`;
                return;
            }

            grid.innerHTML = stories.map(s => `
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col justify-between" onclick="viewStory('${s.id}')">
                    <img src="${s.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" class="w-full h-48 object-cover">
                    <div class="p-3 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-slate-800 line-clamp-1">${s.title}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 mt-1">${s.desc}</p>
                        </div>
                        <div class="flex justify-between items-center text-xs text-slate-400 mt-3 pt-2 border-t">
                            <span><i class="fa-regular fa-eye"></i> ${s.views}</span>
                            <span><i class="fa-regular fa-heart text-red-500"></i> ${s.likes.length}</span>
                            <span>${s.author}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // View Detail Story
        function viewStory(storyId) {
            activeStoryId = storyId;
            const story = db.stories.find(s => s.id === storyId);
            if (!story) return;

            story.views += 1;
            saveData();

            const isLiked = currentUser && story.likes.includes(currentUser.username);
            const isOwner = currentUser && (currentUser.username === story.author || currentUser.role === 'admin');

            const detailBox = document.getElementById('story-detail-content');
            detailBox.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <img src="${story.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" class="w-full md:w-48 h-64 object-cover rounded-lg shadow">
                    <div class="space-y-3 flex-grow">
                        <div class="flex justify-between items-start">
                            <h2 class="text-2xl font-bold text-slate-800">${story.title}</h2>
                            ${currentUser && currentUser.role === 'admin' ? `
                                <button onclick="deleteStory('${story.id}')" class="px-3 py-1 bg-red-600 text-white rounded text-xs"><i class="fa-solid fa-trash"></i> Xóa Truyện</button>
                            ` : ''}
                        </div>
                        <p class="text-xs text-indigo-600 font-semibold">Tác giả: ${story.author}</p>
                        <p class="text-sm text-slate-600 leading-relaxed">${story.desc}</p>
                        <div class="flex gap-4 items-center pt-2">
                            <button onclick="toggleLike('${story.id}')" class="px-4 py-2 border rounded-lg text-sm flex items-center gap-2 ${isLiked ? 'bg-red-50 border-red-200 text-red-600' : 'text-slate-600'}">
                                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-red-500"></i>
                                <span>${story.likes.length} Thích</span>
                            </button>
                            <span class="text-xs text-slate-400"><i class="fa-regular fa-eye"></i> ${story.views} lượt xem</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('add-chap-btn').classList.toggle('hidden', !isOwner);
            renderChapters(story);
            showSection('detail');
        }

        function renderChapters(story) {
            const list = document.getElementById('chapter-list');
            if (story.chapters.length === 0) {
                list.innerHTML = `<div class="py-4 text-slate-400 text-sm">Chưa có chương nào.</div>`;
                return;
            }

            list.innerHTML = story.chapters.map((c, index) => {
                const isUnlocked = c.price === 0 || (currentUser && (c.unlockedBy.includes(currentUser.username) || story.author === currentUser.username || currentUser.role === 'admin'));
                return `
                    <div class="py-3 flex justify-between items-center hover:bg-slate-50 px-2 rounded">
                        <div class="cursor-pointer" onclick="readChapter('${c.id}')">
                            <span class="font-medium text-sm">Chương ${index + 1}: ${c.title}</span>
                            ${c.price > 0 ? `<span class="ml-2 text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full"><i class="fa-solid fa-coins"></i> ${c.price} Xu</span>` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="readChapter('${c.id}')" class="text-xs px-3 py-1 bg-indigo-50 text-indigo-600 font-semibold rounded hover:bg-indigo-100">
                                ${isUnlocked ? 'Đọc' : 'Mở khóa'}
                            </button>
                            ${currentUser && currentUser.role === 'admin' ? `
                                <button onclick="deleteChapter('${story.id}', '${c.id}')" class="text-xs text-red-500 hover:underline"><i class="fa-solid fa-trash"></i></button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Read Chapter Logic
        function readChapter(chapId) {
            activeChapterId = chapId;
            const story = db.stories.find(s => s.id === activeStoryId);
            const chap = story.chapters.find(c => c.id === chapId);

            const isUnlocked = chap.price === 0 || (currentUser && (chap.unlockedBy.includes(currentUser.username) || story.author === currentUser.username || currentUser.role === 'admin'));

            if (!isUnlocked) {
                if (!currentUser) {
                    alert('Bạn cần đăng nhập để mở khóa chương này!');
                    openAuthModal(true);
                    return;
                }
                if (confirm(`Chương này yêu cầu ${chap.price} Xu để mở khóa. Bạn có muốn dùng Xu không?`)) {
                    const freshUser = db.users.find(u => u.username === currentUser.username);
                    if (freshUser.coins < chap.price) {
                        alert('Bạn không đủ Xu! Hãy xem quảng cáo để nhận thêm Xu.');
                        return;
                    }
                    // Deduct coins & pay author
                    freshUser.coins -= chap.price;
                    const author = db.users.find(u => u.username === story.author);
                    if (author) author.coins += chap.price;

                    chap.unlockedBy.push(currentUser.username);
                    saveData();
                    updateNav();
                    alert('Mở khóa thành công!');
                } else {
                    return;
                }
            }

            // Render Reader Content
            const reader = document.getElementById('chapter-reader');
            let contentHtml = '';

            if (chap.type === 'text') {
                contentHtml = `<p class="whitespace-pre-line text-slate-700 leading-relaxed">${chap.content}</p>`;
            } else if (chap.type === 'comic') {
                contentHtml = `<div class="space-y-2">${chap.content.map(img => `<img src="${img}" class="w-full rounded">`).join('')}</div>`;
            } else if (chap.type === 'audio') {
                contentHtml = `<audio controls class="w-full mt-4"><source src="${chap.content}" type="audio/mpeg"></audio>`;
            }

            reader.innerHTML = `
                <h2 class="text-xl font-bold text-slate-800 border-b pb-3">${chap.title}</h2>
                <div class="py-4">${contentHtml}</div>
            `;

            renderComments(chap);
            showSection('read');
        }

        function backToStory() {
            showSection('detail');
        }

        // Comment System
        function renderComments(chap) {
            const list = document.getElementById('comments-list');
            if (!chap.comments || chap.comments.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400">Chưa có bình luận nào.</p>`;
                return;
            }

            list.innerHTML = chap.comments.map((cmt, idx) => `
                <div class="bg-slate-50 p-3 rounded-lg flex justify-between items-start">
                    <div>
                        <span class="font-bold text-xs text-indigo-600">${cmt.user}</span>
                        <p class="text-sm text-slate-700 mt-0.5">${cmt.text}</p>
                    </div>
                    ${currentUser && currentUser.role === 'admin' ? `
                        <button onclick="deleteComment('${idx}')" class="text-xs text-red-500 hover:underline"><i class="fa-solid fa-trash"></i></button>
                    ` : ''}
                </div>
            `).join('');
        }

        function addComment() {
            if (!currentUser) {
                alert('Bạn cần đăng nhập để viết bình luận!');
                openAuthModal(true);
                return;
            }
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text) return;

            const story = db.stories.find(s => s.id === activeStoryId);
            const chap = story.chapters.find(c => c.id === activeChapterId);
            if (!chap.comments) chap.comments = [];

            chap.comments.push({ user: currentUser.username, text: text });
            saveData();
            input.value = '';
            renderComments(chap);
        }

        function toggleLike(storyId) {
            if (!currentUser) {
                alert('Bạn cần đăng nhập để thả tim bài viết!');
                openAuthModal(true);
                return;
            }
            const story = db.stories.find(s => s.id === storyId);
            const index = story.likes.indexOf(currentUser.username);
            if (index > -1) {
                story.likes.splice(index, 1);
            } else {
                story.likes.push(currentUser.username);
            }
            saveData();
            viewStory(storyId);
        }

        // Admin Panel Rendering & Actions
        function renderAdminPanel() {
            if (!currentUser || currentUser.role !== 'admin') {
                showSection('home');
                return;
            }
            const list = document.getElementById('admin-user-list');
            list.innerHTML = db.users.map(u => `
                <div class="py-3 flex justify-between items-center">
                    <div>
                        <span class="font-bold text-sm">${u.username}</span>
                        <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded ml-2">${u.coins} Xu</span>
                        ${u.banned ? '<span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded ml-1 font-bold">Đã cấm</span>' : ''}
                    </div>
                    ${u.username !== 'quantrithuylinh' ? `
                        <div class="flex gap-2">
                            <button onclick="adminGiveCoins('${u.username}')" class="px-2 py-1 bg-emerald-600 text-white text-xs rounded">+ Tặng Xu</button>
                            <button onclick="adminToggleBan('${u.username}')" class="px-2 py-1 ${u.banned ? 'bg-gray-500' : 'bg-red-600'} text-white text-xs rounded">
                                ${u.banned ? 'Bỏ Cấm' : 'Cấm Truy Cập'}
                            </button>
                        </div>
                    ` : '<span class="text-xs text-slate-400">Tài khoản Quản trị</span>'}
                </div>
            `).join('');
        }

        function adminGiveCoins(username) {
            const amount = prompt(`Nhập số Xu muốn tặng cho ${username}:`, '100');
            if (amount && !isNaN(amount)) {
                const user = db.users.find(u => u.username === username);
                user.coins += parseInt(amount);
                saveData();
                renderAdminPanel();
                updateNav();
                alert(`Đã tặng ${amount} Xu cho ${username}!`);
            }
        }

        function adminToggleBan(username) {
            const user = db.users.find(u => u.username === username);
            user.banned = !user.banned;
            saveData();
            renderAdminPanel();
            alert(`Đã ${user.banned ? 'CẤM' : 'GỠ CẤM'} tài khoản ${username}!`);
        }

        function deleteStory(storyId) {
            if (confirm('Bạn có chắc chắn muốn xóa bộ truyện này?')) {
                db.stories = db.stories.filter(s => s.id !== storyId);
                saveData();
                showSection('home');
            }
        }

        function deleteChapter(storyId, chapId) {
            if (confirm('Bạn có chắc muốn xóa chương này?')) {
                const story = db.stories.find(s => s.id === storyId);
                story.chapters = story.chapters.filter(c => c.id !== chapId);
                saveData();
                viewStory(storyId);
            }
        }

        function deleteComment(commentIdx) {
            if (confirm('Bạn có chắc muốn xóa bình luận này?')) {
                const story = db.stories.find(s => s.id === activeStoryId);
                const chap = story.chapters.find(c => c.id === activeChapterId);
                chap.comments.splice(commentIdx, 1);
                saveData();
                renderComments(chap);
            }
        }

        // Ads System
        function watchAds() {
            if (!currentUser) return;
            alert('Đang xem quảng cáo (5 giây)...');
            setTimeout(() => {
                const user = db.users.find(u => u.username === currentUser.username);
                user.coins += 20;
                saveData();
                updateNav();
                alert('Xem thành công! Bạn nhận được +20 Xu.');
            }, 1000);
        }

        // Authentication Handlers
        function openAuthModal(isLogin) {
            isAuthLogin = isLogin;
            document.getElementById('auth-title').innerText = isLogin ? 'Đăng Nhập' : 'Đăng Ký';
            document.getElementById('auth-toggle-text').innerText = isLogin ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
            document.getElementById('auth-toggle-btn').innerText = isLogin ? 'Đăng ký' : 'Đăng nhập';
            openModal('modal-auth');
        }

        function toggleAuthMode() {
            openAuthModal(!isAuthLogin);
        }

        function handleAuth(e) {
            e.preventDefault();
            const un = document.getElementById('auth-username').value.trim();
            const pw = document.getElementById('auth-password').value.trim();

            if (isAuthLogin) {
                const user = db.users.find(u => u.username === un && u.password === pw);
                if (!user) {
                    alert('Sai tên đăng nhập hoặc mật khẩu!');
                    return;
                }
                if (user.banned) {
                    alert('Tài khoản này đã bị Admin cấm truy cập!');
                    return;
                }
                currentUser = user;
            } else {
                if (db.users.find(u => u.username === un)) {
                    alert('Tên đăng nhập đã tồn tại!');
                    return;
                }
                const newUser = { username: un, password: pw, coins: 50, role: 'user', banned: false };
                db.users.push(newUser);
                currentUser = newUser;
            }
            saveData();
            updateNav();
            closeModal('modal-auth');
            document.getElementById('auth-form').reset();
        }

        function logout() {
            currentUser = null;
            saveData();
            updateNav();
            showSection('home');
        }

        // Story Creation
        function handleCreateStory(e) {
            e.preventDefault();
            if (!currentUser) return;

            const title = document.getElementById('story-title').value.trim();
            const desc = document.getElementById('story-desc').value.trim();
            const coverInput = document.getElementById('story-cover');

            const newStory = {
                id: 's_' + Date.now(),
                title: title,
                desc: desc,
                author: currentUser.username,
                cover: '',
                views: 0,
                likes: [],
                chapters: []
            };

            if (coverInput.files && coverInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    newStory.cover = evt.target.result;
                    db.stories.push(newStory);
                    saveData();
                    closeModal('modal-story');
                    renderStories();
                };
                reader.readAsDataURL(coverInput.files[0]);
            } else {
                db.stories.push(newStory);
                saveData();
                closeModal('modal-story');
                renderStories();
            }
        }

        // Chapter Creation
        function toggleChapInput(type) {
            document.getElementById('input-text-container').classList.toggle('hidden', type !== 'text');
            document.getElementById('input-file-container').classList.toggle('hidden', type === 'text');
        }

        function openAddChapterModal() {
            openModal('modal-chapter');
        }

        function handleCreateChapter(e) {
            e.preventDefault();
            const title = document.getElementById('chap-title').value.trim();
            const price = parseInt(document.getElementById('chap-price').value) || 0;
            const type = document.querySelector('input[name="chap-type"]:checked').value;

            const story = db.stories.find(s => s.id === activeStoryId);

            const newChap = {
                id: 'c_' + Date.now(),
                title: title,
                type: type,
                price: price,
                unlockedBy: [],
                comments: []
            };

            if (type === 'text') {
                newChap.content = document.getElementById('chap-content-text').value;
                story.chapters.push(newChap);
                saveData();
                closeModal('modal-chapter');
                viewStory(activeStoryId);
            } else {
                const files = document.getElementById('chap-content-file').files;
                if (type === 'comic') {
                    let promises = Array.from(files).map(file => {
                        return new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = e => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                    });
                    Promise.all(promises).then(images => {
                        newChap.content = images;
                        story.chapters.push(newChap);
                        saveData();
                        closeModal('modal-chapter');
                        viewStory(activeStoryId);
                    });
                } else if (type === 'audio') {
                    if (files[0]) {
                        const reader = new FileReader();
                        reader.onload = e => {
                            newChap.content = e.target.result;
                            story.chapters.push(newChap);
                            saveData();
                            closeModal('modal-chapter');
                            viewStory(activeStoryId);
                        };
                        reader.readAsDataURL(files[0]);
                    }
                }
            }
        }

        // Helper Modal Tools
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // Initial App Load
        updateNav();
        renderStories();
    </script>
</body>
</html>
