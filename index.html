<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện hay Gn </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes bronzeGlow { 0% { text-shadow: 0 0 5px #cd7f32; } 50% { text-shadow: 0 0 15px #cd7f32; } 100% { text-shadow: 0 0 5px #cd7f32; } }
        @keyframes silverGlow { 0% { text-shadow: 0 0 5px #c0c0c0; } 50% { text-shadow: 0 0 15px #ffffff; } 100% { text-shadow: 0 0 5px #c0c0c0; } }
        @keyframes goldGlow { 0% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } 50% { text-shadow: 0 0 20px #ffae00; transform: scale(1.02); } 100% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } }
        @keyframes diamondGlow { 0% { text-shadow: 0 0 5px #00ffff; } 50% { text-shadow: 0 0 20px #0088ff; } 100% { text-shadow: 0 0 5px #00ffff; } }
        @keyframes legendGlow { 0% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } 33% { color: #00ff00; text-shadow: 0 0 8px #00ff00; } 66% { color: #0088ff; text-shadow: 0 0 8px #0088ff; } 100% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } }

        .badge-dong { animation: bronzeGlow 2s infinite; color: #cd7f32; font-weight: bold; }
        .badge-bac { animation: silverGlow 2s infinite; color: #e0e0e0; font-weight: bold; }
        .badge-vang { animation: goldGlow 2s infinite; color: #ffd700; font-weight: bold; }
        .badge-kimcuong { animation: diamondGlow 2s infinite; color: #00ffff; font-weight: bold; }
        .badge-huyen-thoai { animation: legendGlow 3s infinite; font-weight: bold; }
        
        .comic-image-container img {
            display: block;
            margin: 0;
            padding: 0;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body id="mainBody" class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Thanh Thông Báo Hệ Thống -->
    <div id="systemNotificationBar" class="bg-indigo-600 text-white px-4 py-2 text-center text-sm font-medium shadow-md transition-all duration-300 flex justify-between items-center">
        <div id="notificationText" class="w-full truncate">📢 Chào mừng bạn đến với nền tảng Sáng Tác & Đọc Truyện đa thiết bị! Đồng bộ trực tuyến mượt mà.</div>
        <button onclick="closeNotificationBar()" class="text-white hover:text-gray-200 ml-4"><i class="fas fa-times"></i></button>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="backBtn" onclick="goBack()" class="hidden bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                    <i class="fas fa-arrow-left"></i> <span>Quay lại</span>
                </button>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent cursor-pointer" onclick="switchView('home')">StoryVerse</h1>
            </div>

            <!-- Thanh tìm kiếm nhanh -->
            <div class="hidden md:flex items-center space-x-2 bg-gray-700 rounded-lg px-3 py-1.5 w-1/3">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="globalSearchInput" placeholder="Tìm tên truyện, thể loại, hoặc tên tác giả..." class="bg-transparent border-none focus:outline-none text-sm w-full text-white" oninput="handleGlobalSearch(this.value)">
            </div>

            <div class="flex items-center space-x-4" id="authNavSection">
                <!-- Nội dung hiển thị dựa vào trạng thái đăng nhập -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4" id="appMainContent">
        <!-- Khu vực hiển thị động nội dung ứng dụng -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-sm text-gray-400">
        <p>&copy; 2026 StoryVerse - Nền tảng Sáng Tác & Đọc Truyện Đa Thiết Bị.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase của bạn (Thay thế bằng thông số dự án Firebase thực tế)
        const firebaseConfig = {
    apiKey: "AIzaSyCnk_ubHwUVK_Z8EScWZufJSPnH4d0a9p8",
    authDomain: "truyenhaygn.firebaseapp.com",
    projectId: "truyenhaygn",
    storageBucket: "truyenhaygn.appspot.com",
    messagingSenderId: "608010144020",
    appId: "1:608010144020:web:3a7965447f7c74246bda01",
    measurementId: "G-JQ54X4X0C8"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Biến lưu trạng thái cục bộ
        window.currentUser = null;
        window.currentProfile = null;
        window.currentView = 'home';
        window.historyStack = [];

        // Khởi tạo ứng dụng kiểm tra đăng nhập
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    window.currentProfile = userSnap.data();
                } else {
                    // Tạo profile mặc định nếu chưa có
                    window.currentProfile = {
                        uid: user.uid,
                        username: user.email.split('@')[0],
                        displayName: user.email.split('@')[0],
                        coins: 50,
                        reputation: 0,
                        bgUrl: '',
                        role: 'author',
                        hearts: 0,
                        dailyCoinExchanges: 0,
                        lastExchangeDate: ''
                    };
                    await setDoc(userDocRef, window.currentProfile);
                }
            } else {
                window.currentUser = null;
                window.currentProfile = null;
            }
            renderNavbar();
            renderHome();
        });

        // Gắn các hàm global cho script HTML
        window.db = db;
        window.auth = auth;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;
    </script>

    <!-- App Logic Scripts -->
    <script>
        // Điều hướng & Lịch sử trang
        function switchView(viewName, params = {}) {
            window.historyStack.push({ view: window.currentView, params: window.currentParams || {} });
            window.currentView = viewName;
            window.currentParams = params;
            document.getElementById('backBtn').classList.remove('hidden');
            renderCurrentView();
        }

        function goBack() {
            if (window.historyStack.length > 0) {
                const prev = window.historyStack.pop();
                window.currentView = prev.view;
                window.currentParams = prev.params;
                if (window.historyStack.length === 0) {
                    document.getElementById('backBtn').classList.add('hidden');
                }
                renderCurrentView();
            }
        }

        function renderCurrentView() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = '';
            switch(window.currentView) {
                case 'home': renderHome(); break;
                case 'auth': renderAuthPage(); break;
                case 'studio': renderStudioPage(); break;
                case 'create-story': renderCreateStoryPage(); break;
                case 'read-story': renderReadStoryPage(window.currentParams.storyId); break;
                case 'author-profile': renderAuthorProfilePage(window.currentParams.authorId); break;
                case 'messages': renderMessagesPage(); break;
                case 'coins': renderCoinsPage(); break;
                case 'admin-panel': renderAdminPanel(); break;
                default: renderHome();
            }
        }

        function renderNavbar() {
            const nav = document.getElementById('authNavSection');
            if (!window.currentUser || !window.currentProfile) {
                nav.innerHTML = `
                    <button onclick="switchView('auth')" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition">Đăng nhập / Đăng ký</button>
                `;
            } else {
                const p = window.currentProfile;
                const isAdmin = p.username === 'quanly';
                nav.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <button onclick="switchView('coins')" class="bg-yellow-600/20 border border-yellow-500 text-yellow-400 px-3 py-1 rounded-full text-xs font-bold flex items-center space-x-1">
                            <i class="fas fa-coins"></i> <span>${p.coins} Xu</span>
                        </button>
                        <button onclick="switchView('messages')" class="relative text-gray-300 hover:text-white">
                            <i class="fas fa-envelope text-lg"></i>
                        </button>
                        <button onclick="switchView('studio')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                            <i class="fas fa-pen-nib mr-1"></i> Sáng tác
                        </button>
                        ${isAdmin ? `<button onclick="switchView('admin-panel')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm font-medium transition text-white">Quản Lý</button>` : ''}
                        <div class="flex items-center space-x-2 cursor-pointer" onclick="switchView('author-profile', {authorId: '${p.uid}'})">
                            <img src="${p.bgUrl || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover border border-purple-500">
                            <span class="text-sm font-semibold ${getRankClass(p.reputation)}">${p.displayName || p.username}</span>
                        </div>
                        <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                `;
            }
        }

        function getRankClass(reputation) {
            if (reputation >= 1000000) return 'badge-huyen-thoai';
            if (reputation >= 100000) return 'badge-kimcuong';
            if (reputation >= 10000) return 'badge-vang';
            if (reputation >= 1000) return 'badge-bac';
            if (reputation >= 100) return 'badge-dong';
            return 'text-gray-200';
        }

        function getRankName(reputation) {
            if (reputation >= 1000000) return 'Huyền thoại';
            if (reputation >= 100000) return 'Kim cương';
            if (reputation >= 10000) return 'Vàng';
            if (reputation >= 1000) return 'Bạc';
            if (reputation >= 100) return 'Đồng';
            return 'Tập sự';
        }

        // --- Giao diện Trang Chủ ---
        async function renderHome() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-800 to-indigo-900 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-extrabold text-white mb-2">Khám Phá Thế Giới Truyện Tranh & Chữ</h2>
                            <p class="text-purple-200 text-sm">Đọc truyện mượt mà, đồng bộ hoàn hảo giữa điện thoại và máy tính.</p>
                        </div>
                        <button onclick="switchView('create-story')" class="mt-4 md:mt-0 bg-pink-600 hover:bg-pink-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition">Viết Truyện Ngay</button>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-4 text-purple-300">Tác phẩm đề xuất & nổi bật</h3>
                        <div id="storyListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <p class="text-gray-400">Đang tải danh sách tác phẩm...</p>
                        </div>
                    </div>
                </div>
            `;
            loadStories();
        }

        async function loadStories() {
            const container = document.getElementById('storyListContainer');
            try {
                const q = window.query(window.collection(window.db, "stories"), window.orderBy("hearts", "desc"));
                const querySnapshot = await window.getDocs(q);
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">Chưa có tác phẩm nào được đăng.</p>`;
                    return;
                }
                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const story = docSnap.data();
                    const sId = docSnap.id;
                    html += `
                        <div onclick="switchView('read-story', {storyId: '${sId}'})" class="bg-gray-800 rounded-xl overflow-hidden shadow-md hover:shadow-purple-500/20 transition cursor-pointer border border-gray-700 flex flex-col">
                            <div class="h-40 bg-cover bg-center" style="background-image: url('${story.coverUrl || 'https://via.placeholder.com/300'}')"></div>
                            <div class="p-4 flex flex-col flex-grow">
                                <span class="text-xs text-pink-400 font-semibold mb-1 uppercase">${story.genre} • ${story.type}</span>
                                <h4 class="text-lg font-bold text-white truncate">${story.title}</h4>
                                <p class="text-xs text-gray-400 mb-2">Tác giả: ${story.authorName}</p>
                                <p class="text-xs text-gray-300 line-clamp-2 mb-4 flex-grow">${story.description}</p>
                                <div class="flex justify-between items-center text-xs text-gray-400 border-t border-gray-700 pt-2">
                                    <span><i class="fas fa-heart text-red-500 mr-1"></i> ${story.hearts || 0}</span>
                                    <span><i class="fas fa-coins text-yellow-500 mr-1"></i> Thu nhập: ${story.collectedCoins || 0}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = `<p class="text-red-400">Lỗi tải danh sách tác phẩm.</p>`;
            }
        }

        // --- Trang Đăng Nhập / Đăng Ký ---
        function renderAuthPage() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 mt-10">
                    <div class="flex border-b border-gray-700 mb-6">
                        <button onclick="toggleAuthTab('login')" id="loginTabBtn" class="w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500">Đăng Nhập</button>
                        <button onclick="toggleAuthTab('register')" id="registerTabBtn" class="w-1/2 pb-3 font-bold text-gray-400">Đăng Ký</button>
                    </div>
                    <div id="authFormContainer">
                        <!-- Form Đăng Nhập Mặc Định -->
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                                <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                                <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function toggleAuthTab(tab) {
            const container = document.getElementById('authFormContainer');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');
            if (tab === 'login') {
                loginBtn.className = "w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500";
                regBtn.className = "w-1/2 pb-3 font-bold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                            <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                            <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                    </form>
                `;
            } else {
                regBtn.className = "w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500";
                loginBtn.className = "w-1/2 pb-3 font-bold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập (Duy nhất)</label>
                            <input type="text" id="regUsername" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Email</label>
                            <input type="email" id="regEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                            <input type="password" id="regPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Ký</button>
                    </form>
                `;
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            let emailToUse = identifier;

            // Xử lý đăng nhập tài khoản quản lý hoặc tên đăng nhập thường
            if (identifier === 'quanly') {
                emailToUse = 'quanly@storyverse.internal';
            } else if (!identifier.includes('@')) {
                emailToUse = identifier + '@storyverse.internal';
            }

            try {
                await window.signInWithEmailAndPassword(window.auth, emailToUse, pass);
                alert("Đăng nhập thành công!");
                switchView('home');
            } catch (err) {
                alert("Đăng nhập thất bại: " + err.message);
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const emailInput = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (username === 'quanly') {
                alert("Tên tài khoản này đã được hệ thống đăng ký sẵn!");
                return;
            }

            try {
                // Kiểm tra trùng tên đăng nhập
                const q = window.query(window.collection(window.db, "users"), window.where("username", "==", username));
                const snap = await window.getDocs(q);
                if (!snap.empty) {
                    alert("Tên đăng nhập đã tồn tại! Vui lòng chọn tên khác.");
                    return;
                }

                const emailToUse = emailInput.includes('@') ? emailInput : username + '@storyverse.internal';
                const cred = await window.createUserWithEmailAndPassword(window.auth, emailToUse, pass);
                
                const userProfile = {
                    uid: cred.user.uid,
                    username: username,
                    displayName: username,
                    coins: 100, // Thưởng khởi tạo
                    reputation: 0,
                    bgUrl: '',
                    role: 'author',
                    hearts: 0,
                    dailyCoinExchanges: 0,
                    lastExchangeDate: ''
                };
                await window.setDoc(window.doc(window.db, "users", cred.user.uid), userProfile);
                alert("Đăng ký tài khoản thành công!");
                switchView('home');
            } catch (err) {
                alert("Đăng ký thất bại: " + err.message);
            }
        }

        async function handleLogout() {
            await window.signOut(window.auth);
            switchView('home');
        }

        // --- Trang Sáng Tác (Studio) ---
        function renderStudioPage() {
            if (!window.currentUser) {
                switchView('auth');
                return;
            }
            const p = window.currentProfile;
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 flex flex-col md:flex-row justify-between items-center">
                        <div class="flex items-center space-x-4">
                            <img src="${p.bgUrl || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full object-cover border-2 border-purple-500">
                            <div>
                                <h2 class="text-2xl font-bold ${getRankClass(p.reputation)}">${p.displayName || p.username}</h2>
                                <p class="text-xs text-gray-400">Cấp bậc: ${getRankName(p.reputation)} | Độ nổi tiếng: ${p.reputation} | Xu: ${p.coins}</p>
                            </div>
                        </div>
                        <div class="mt-4 md:mt-0 flex space-x-3">
                            <button onclick="switchView('create-story')" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-xl text-sm font-bold transition">Tạo Tác Phẩm Mới</button>
                            <button onclick="openEditProfileModal()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl text-sm font-bold transition">Cài Đặt Hồ Sơ</button>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xl font-bold mb-4 text-purple-300">Tác phẩm của tôi</h3>
                        <div id="myStoriesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <p class="text-gray-400">Đang tải tác phẩm...</p>
                        </div>
                    </div>
                </div>

        async function likeStory(storyId) {
            if (!window.currentUser) {
                switchView('auth');
                return;
            }
            const storyRef = window.doc(window.db, "stories", storyId);
            const storySnap = await window.getDoc(storyRef);
            const storyData = storySnap.data();

            const newHearts = (storyData.hearts || 0) + 1;
            await window.updateDoc(storyRef, { hearts: newHearts });

            // Cộng 1 độ nổi tiếng cho tác giả
            const authorRef = window.doc(window.db, "users", storyData.authorId);
            const authorSnap = await window.getDoc(authorRef);
            if (authorSnap.exists()) {
                const authorData = authorSnap.data();
                await window.updateDoc(authorRef, { reputation: (authorData.reputation || 0) + 1 });
            }

            alert("Đã thả tim thành công (+1 độ nổi tiếng cho tác giả)!");
            renderReadStoryPage(storyId);
        }

        async function openAddChapterModal(storyId) {
            const title = prompt("Nhập tên chương:");
            if (!title) return;
            const price = parseInt(prompt("Nhập giá xu mở khóa chương (0 nếu đọc miễn phí):", "0") || "0");
            const type = prompt("Nhập kiểu nội dung: 'text' (Truyện chữ), 'comic' (Truyện tranh - các link ảnh cách nhau bởi dấu phẩy), hoặc 'audio' (Link âm thanh):", "text");
            const content = prompt("Nhập nội dung (văn bản, danh sách link ảnh cách nhau bằng dấu phẩy, hoặc link audio):");

            if (!content) return;

            const chapterData = {
                title,
                price,
                type,
                content,
                createdAt: window.serverTimestamp()
            };

            await window.addDoc(window.collection(window.db, "stories", storyId, "chapters"), chapterData);
            alert("Thêm chương thành công!");
            renderReadStoryPage(storyId);

        async function deleteChapter(storyId, chapterId) {

                alert("Đã xóa chương!");
                renderReadStoryPage(storyId);
            }

        async function viewChapter(storyId, chapterId, price) {
            const chSnap = await window.getDoc(window.doc(window.db, "stories", storyId, "chapters", chapterId));
            const ch = chSnap.data();

            // Kiểm tra mở khóa nếu có giá xu
            if (price > 0) {
                // Kiểm tra xem user hiện tại đã mở khóa chưa hoặc là tác giả
                const storySnap = await window.getDoc(window.doc(window.db, "stories", storyId));
                const storyData = storySnap.data();
                const isAuthor = window.currentUser && window.currentUser.uid === storyData.authorId;
                const isAdmin = window.currentProfile && window.currentProfile.username === 'quanly';

                if (!isAuthor && !isAdmin) {
                    // Kiểm tra xem đã mở khóa trong lịch sử chưa (đơn giản hóa bằng xác nhận dùng xu)
                    const confirmUnlock = confirm(`Chương này yêu cầu ${price} xu để mở khóa. Bạn có muốn mở?`);
                    if (!confirmUnlock) return;

                    if (window.currentProfile.coins < price) {
                        alert("Bạn không đủ xu để mở khóa chương này!");
                        return;
                    }

                    // Trừ xu người đọc, cộng xu tác giả
                    window.currentProfile.coins -= price;
                    await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });

                    // Cộng thu nhập xu cho truyện và tác giả
                    await window.updateDoc(window.doc(window.db, "stories", storyId), { collectedCoins: (storyData.collectedCoins || 0) + price });
                    const authorSnap = await window.getDoc(window.doc(window.db, "users", storyData.authorId));
                    if (authorSnap.exists()) {
                        await window.updateDoc(window.doc(window.db, "users", storyData.authorId), { coins: (authorSnap.data().coins || 0) + price });
                    }
                    alert("Mở khóa thành công!");
                    renderNavbar();
                }
            }

            const viewer = document.getElementById('chapterViewerContainer');
            let contentHtml = '';

            if (ch.type === 'comic') {
                // Truyện tranh: các ảnh gắn kết không khoảng trắng
                const images = ch.content.split(',').map(url => url.trim());
                contentHtml = `
                    <div class="comic-image-container flex flex-col items-center">
                        ${images.map(img => `<img src="${img}" alt="comic page" class="w-full max-w-3xl">`).join('')}
                    </div>
                `;
            } else if (ch.type === 'audio') {
                contentHtml = `
                    <div class="p-6 text-center">
                        <audio controls class="mx-auto w-full max-w-md">
                            <source src="${ch.content}" type="audio/mpeg">
                            Trình duyệt của bạn không hỗ trợ audio.
                        </audio>
                    </div>
                `;
            } else {
                contentHtml = `<div class="whitespace-pre-line leading-relaxed text-gray-200 text-lg">${ch.content}</div>`;
            }

            viewer.innerHTML = `
                <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 mt-6 space-y-6">
                    <h3 class="text-2xl font-bold text-purple-300 border-b border-gray-700 pb-3">${ch.title}</h3>
                    ${contentHtml}
                    <!-- Phần bình luận chương -->
                    <div class="border-t border-gray-700 pt-6 mt-6">
                        <h4 class="text-lg font-bold mb-4 text-white">Bình luận chương</h4>
                        <div id="commentList_${chapterId}" class="space-y-3 mb-4">
                            <!-- Danh sách bình luận -->
                        </div>
                        ${window.currentUser ? `
                            <div class="flex space-x-2">
                                <input type="text" id="commentInput_${chapterId}" placeholder="Viết bình luận..." class="flex-grow bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                                <button onclick="postComment('${storyId}', '${chapterId}')" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-bold">Gửi</button>
                            </div>
                        ` : '<p class="text-xs text-gray-400">Vui lòng đăng nhập để bình luận.</p>'}
                    </div>
                </div>
            `;
            loadComments(storyId, chapterId);
        }

        async function loadComments(storyId, chapterId) {
            const container = document.getElementById(`commentList_${chapterId}`);
            const q = window.query(window.collection(window.db, "stories", storyId, "chapters", chapterId, "comments"), window.orderBy("createdAt", "desc"));
            const snap = await window.getDocs(q);
            if (snap.empty) {
                container.innerHTML = `<p class="text-xs text-gray-400">Chưa có bình luận nào.</p>`;
                return;
            }
            let html = '';
            snap.forEach(d => {
                const c = d.data();
                const cId = d.id;
                const isAdmin = window.currentProfile && window.currentProfile.username === 'quanly';
                html += `
                    <div class="bg-gray-700/40 p-3 rounded-lg flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-purple-400">${c.authorName}</span>
                            <p class="text-sm text-gray-200 mt-1">${c.text}</p>
                        </div>
                        ${isAdmin ? `<button onclick="deleteComment('${storyId}', '${chapterId}', '${cId}')" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function postComment(storyId, chapterId) {
            const input = document.getElementById(`commentInput_${chapterId}`);
            const text = input.value.trim();
            if (!text) return;

            await window.addDoc(window.collection(window.db, "stories", storyId, "chapters", chapterId, "comments"), {
                text,
                authorId: window.currentUser.uid,
                authorName: window.currentProfile.displayName || window.currentProfile.username,
                createdAt: window.serverTimestamp()
            });
            input.value = '';
            loadComments(storyId, chapterId);
        }

        async function openDonateModal(targetAuthorId, targetAuthorName) {
            const amountStr = prompt(`Nhập số xu muốn tặng cho ${targetAuthorName}:`);
            if (!amountStr) return;
            const amount = parseInt(amountStr);
            if (isNaN(amount) || amount <= 0) {
                alert("Số lượng xu không hợp lệ!");
                return;
            }

            const isAdmin = window.currentProfile.username === 'quanly';
            if (!isAdmin && window.currentProfile.coins < amount) {
                alert("Bạn không đủ xu để tặng!");
                return;
            }

            // Trừ xu người tặng (trừ khi là quản lý)
            if (!isAdmin) {
                window.currentProfile.coins -= amount;
                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });
            }

            // Cộng xu tác giả được nhận
            const targetRef = window.doc(window.db, "users", targetAuthorId);
            const targetSnap = await window.getDoc(targetRef);
            if (targetSnap.exists()) {
                await window.updateDoc(targetRef, { coins: (targetSnap.data().coins || 0) + amount });
            }

            alert(`Đã tặng thành công ${amount} xu cho tác giả!`);
            renderNavbar();
        }

                <div class="max-w-xl mx-auto bg-gray-800 p-8 rounded-2xl border border-gray-700 space-y-6">
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-yellow-400 mb-1"><i class="fas fa-coins mr-2"></i> Kho Xu Của Bạn</h2>
                        <p class="text-4xl font-extrabold text-white">${p.coins} Xu</p>
                    </div>
                    <div class="bg-gray-700/50 p-4 rounded-xl space-y-3">
                        <h3 class="font-bold text-purple-300">Kiếm Xu Miễn Phí</h3>
                        <p class="text-xs text-gray-300">Xem quảng cáo hoặc hoàn thành nhiệm vụ điểm danh nhận ngay 50 xu mỗi ngày!</p>
                        <button onclick="claimDailyCoins()" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 rounded-lg transition">Nhận 50 Xu Hàng Ngày</button>
                    </div>
                    <div class="bg-gray-700/50 p-4 rounded-xl space-y-3">
                        <h3 class="font-bold text-purple-300">Đổi Xu Thành Độ Nổi Tiếng</h3>
                        <p class="text-xs text-gray-300">Tỷ lệ: 10 xu = 1 Độ nổi tiếng. Tối đa 5 lần mỗi ngày.</p>
                        <button onclick="exchangeCoinsForReputation()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg transition">Đổi 10 Xu thành 1 Độ Nổi Tiếng</button>
                    </div>
                </div>
            `;
        }

        async function claimDailyCoins() {
            window.currentProfile.coins += 50;
            await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });
            alert("Đã nhận thành công 50 xu!");
            renderCoinsPage();
            renderNavbar();
        }

        async function exchangeCoinsForReputation() {
            const today = new Date().toDateString();
            if (window.currentProfile.lastExchangeDate !== today) {
                window.currentProfile.lastExchangeDate = today;
                window.currentProfile.dailyCoinExchanges = 0;
            }

            if (window.currentProfile.dailyCoinExchanges >= 5) {
                alert("Bạn đã đạt giới hạn đổi 5 lần trong ngày hôm nay!");
                return;
            }

            if (window.currentProfile.coins < 10) {
                alert("Bạn cần ít nhất 10 xu để đổi!");
                return;
            }

            window.currentProfile.coins -= 10;
            window.currentProfile.reputation = (window.currentProfile.reputation || 0) + 1;
            window.currentProfile.dailyCoinExchanges += 1;

            await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                coins: window.currentProfile.coins,
                reputation: window.currentProfile.reputation,
                dailyCoinExchanges: window.currentProfile.dailyCoinExchanges,
                lastExchangeDate: window.currentProfile.lastExchangeDate
            });

            alert("Đổi thành công +1 độ nổi tiếng!");
            renderCoinsPage();
            renderNavbar();
        }

        // --- Gửi Thư Giữa Các Tài Khoản (Tin Nhắn DM) ---
        function renderMessagesPage() {
            if (!window.currentUser) {
                switchView('auth');
                return;
            }
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-2xl border border-gray-700 space-y-4">
                    <h2 class="text-xl font-bold text-purple-300">Hộp Thư / Tin Nhắn</h2>
                    <div class="flex space-x-2">
                        <input type="text" id="recipientUsername" placeholder="Nhập tên tài khoản người nhận..." class="flex-grow bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                    </div>
                    <div class="space-y-2">
                        <textarea id="msgContent" placeholder="Nhập nội dung tin nhắn chữ..." rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm"></textarea>
                        <div class="flex space-x-2">
                            <input type="text" id="msgImgUrl" placeholder="Link ảnh gửi kèm (tùy chọn)..." class="flex-grow bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                        </div>
                    </div>
                    <button onclick="sendDirectMessage()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg transition">Gửi Thư</button>
                    
                    <div class="border-t border-gray-700 pt-4 mt-6">
                        <h3 class="font-bold text-white mb-3">Thư đã nhận</h3>
                        <div id="inboxContainer" class="space-y-3">
                            <p class="text-gray-400 text-sm">Đang tải hộp thư...</p>
                        </div>
                    </div>
                </div>
            `;
            loadInbox();
        }

        async function sendDirectMessage() {
            const recipientName = document.getElementById('recipientUsername').value.trim().toLowerCase();
            const text = document.getElementById('msgContent').value.trim();
            const imgUrl = document.getElementById('msgImgUrl').value.trim();

            if (!recipientName || !text) {
                alert("Vui lòng nhập tên người nhận và nội dung thư!");
                return;
            }

            // Tìm uid của người nhận
            const q = window.query(window.collection(window.db, "users"), window.where("username", "==", recipientName));
            const snap = await window.getDocs(q);
            if (snap.empty) {
                alert("Không tìm thấy người nhận!");
                return;
            }
            let recipientUid = '';
            snap.forEach(d => recipientUid = d.id);

            await window.addDoc(window.collection(window.db, "messages"), {
                senderId: window.currentUser.uid,
                senderName: window.currentProfile.displayName || window.currentProfile.username,
                recipientId: recipientUid,
                text,
                imgUrl,
                createdAt: window.serverTimestamp()
            });

            alert("Gửi thư thành công!");
            document.getElementById('msgContent').value = '';
            document.getElementById('recipientUsername').value = '';
            document.getElementById('msgImgUrl').value = '';
        }

        async function loadInbox() {
            const container = document.getElementById('inboxContainer');
            const q = window.query(window.collection(window.db, "messages"), window.where("recipientId", "==", window.currentUser.uid));
            const snap = await window.getDocs(q);
            if (snap.empty) {
                container.innerHTML = `<p class="text-xs text-gray-400">Hộp thư trống.</p>`;
                return;
            }
            let html = '';
            snap.forEach(d => {
                const m = d.data();
                html += `
                    <div class="bg-gray-700/50 p-4 rounded-xl space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-purple-400">Từ: ${m.senderName}</span>
                        </div>
                        <p class="text-sm text-gray-200">${m.text}</p>
                        ${m.imgUrl ? `<img src="${m.imgUrl}" class="max-h-40 rounded-lg mt-2">` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- Tìm Kiếm Toàn Cục ---
        async function handleGlobalSearch(keyword) {
            if (!keyword.trim()) return;
            // Chuyển tới trang kết quả tìm kiếm đơn giản
            const content = document.getElementById('appMainContent');
            const q = window.query(window.collection(window.db, "stories"));
            const snap = await window.getDocs(q);
            let html = `<h3 class="text-xl font-bold mb-4 text-purple-300">Kết quả tìm kiếm cho: "${keyword}"</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-4">`;
            let found = false;
            snap.forEach(d => {
                const s = d.data();
                if (s.title.toLowerCase().includes(keyword.toLowerCase()) || s.genre.toLowerCase().includes(keyword.toLowerCase()) || s.authorName.toLowerCase().includes(keyword.toLowerCase())) {
                    found = true;
                    html += `
                        <div onclick="switchView('read-story', {storyId: '${d.id}'})" class="bg-gray-800 p-4 rounded-xl border border-gray-700 cursor-pointer hover:border-purple-500 transition">
                            <h4 class="text-lg font-bold text-white">${s.title}</h4>
                            <p class="text-xs text-pink-400 mt-1">${s.genre} • ${s.type}</p>
                            <p class="text-xs text-gray-400 mt-1">Tác giả: ${s.authorName}</p>
                        </div>
                    `;
                }
            });
            html += `</div>`;
            if (!found) html = `<p class="text-gray-400">Không tìm thấy tác phẩm phù hợp.</p>`;
            content.innerHTML = html;
        }

        // --- Bảng Quản Lý Dành Cho Tài Khoản `quanly` ---
        function renderAdminPanel() {
            if (!window.currentProfile || window.currentProfile.username !== 'quanly') {
                switchView('home');
                return;
            }
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-xl mx-auto bg-gray-800 p-8 rounded-2xl border border-red-500 space-y-6">
                    <h2 class="text-2xl font-bold text-red-400"><i class="fas fa-shield-alt mr-2"></i> Bảng Quản Trị Hệ Thống</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Nội Dung Thanh Thông Báo</label>
                            <input type="text" id="adminNotifText" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Màu Sắc Thanh Thông Báo (Tailwind bg class hoặc hex)</label>
                            <input type="text" id="adminNotifColor" placeholder="bg-red-650 hoặc #ff0000" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Đổi Hình Nền Trang Web (URL ảnh)</label>
                            <input type="text" id="adminBgUrl" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                        </div>
                        <button onclick="applyAdminSettings()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition">Áp Dụng Thay Đổi Hệ Thống</button>
                    </div>
                </div>
            `;
        }

        function applyAdminSettings() {
            const notifText = document.getElementById('adminNotifText').value;
            const notifColor = document.getElementById('adminNotifColor').value;
            const bgUrl = document.getElementById('adminBgUrl').value;

            if (notifText) document.getElementById('notificationText').innerText = notifText;
            if (notifColor) document.getElementById('systemNotificationBar').style.background = notifColor;
            if (bgUrl) document.getElementById('mainBody').style.backgroundImage = `url('${bgUrl}')`;

            alert("Đã cập nhật hệ thống thành công!");
        }

        function closeNotificationBar() {
            document.getElementById('systemNotificationBar').style.display = 'none';
        }
    </script>
</body>
</html>
