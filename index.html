<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện hay Gn - Nền Tảng Sáng Tác & Đọc Truyện</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes bronzeGlow { 0% { text-shadow: 0 0 5px #cd7f32; } 50% { text-shadow: 0 0 15px #cd7f32; } 100% { text-shadow: 0 0 5px #cd7f32; } }
        @keyframes silverGlow { 0% { text-shadow: 0 0 5px #c0c0c0; } 50% { text-shadow: 0 0 15px #ffffff; } 100% { text-shadow: 0 0 5px #c0c0c0; } }
        @keyframes goldGlow { 0% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } 50% { text-shadow: 0 0 20px #ffae00; transform: scale(1.02); } 100% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } }
        @keyframes diamondGlow { 0% { text-shadow: 0 0 5px #00ffff; } 50% { text-shadow: 0 0 20px #0088ff; } 100% { text-shadow: 0 0 5px #00ffff; } }
        @keyframes legendGlow { 0% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } 33% { color: #00ff00; text-shadow: 0 0 8px #00ff00; } 66% { color: #0088ff; text-shadow: 0 0 8px #0088ff; } 100% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } }

        .badge-dong { animation: bronzeGlow 2s infinite; color: #cd7f32; font-weight: bold; }
        .badge-bac { animation: silverGlow 2s infinite; color: #e0e0e0; font-weight: bold; }
        .badge-vang { animation: goldGlow 2s infinite; color: #ffd700; font-weight: bold; }
        .badge-kimcuong { animation: diamondGlow 2s infinite; color: #00ffff; font-weight: bold; }
        .badge-huyen-thoai { animation: legendGlow 3s infinite; font-weight: bold; }
        
        .comic-image-container img {
            display: block;
            margin: 0;
            padding: 0;
            width: 100%;
            border: none;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body id="mainBody" class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Thanh Thông Báo Hệ Thống -->
    <div id="systemNotificationBar" class="bg-indigo-600 text-white px-4 py-2 text-center text-sm font-medium shadow-md transition-all duration-300 flex justify-between items-center">
        <div id="notificationText" class="w-full truncate">📢 Chào mừng bạn đến với Truyện hay Gn! Nền tảng sáng tác và đọc truyện đồng bộ đa thiết bị.</div>
        <button onclick="closeNotificationBar()" class="text-white hover:text-gray-200 ml-4"><i class="fas fa-times"></i></button>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="backBtn" onclick="goBack()" class="hidden bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                    <i class="fas fa-arrow-left"></i> <span>Quay lại</span>
                </button>
                <h1 class="text-xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent cursor-pointer tracking-wide" onclick="switchView('home')">Truyện hay Gn</h1>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="hidden md:flex items-center space-x-2 bg-gray-700/80 border border-gray-600 rounded-lg px-3 py-1.5 w-1/3 focus-within:border-purple-500 transition">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="globalSearchInput" placeholder="Tìm tên truyện, thể loại, kiểu hình, tác giả..." class="bg-transparent border-none focus:outline-none text-sm w-full text-white placeholder-gray-400" oninput="handleGlobalSearch(this.value)">
            </div>

            <div class="flex items-center space-x-3" id="authNavSection"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4" id="appMainContent"></main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-sm text-gray-400">
        <p>&copy; 2026 Truyện hay Gn - Nền tảng Sáng Tác & Đọc Truyện Chuyên Nghiệp.</p>
    </footer>

    <!-- DYNAMIC CUSTOM MODAL CONTAINER -->
    <div id="customModalContainer" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div id="customModalBox" class="bg-gray-800 border border-gray-700 rounded-3xl shadow-2xl max-w-lg w-full p-6 space-y-4 relative text-gray-100">
            <!-- Modal Content Loaded Dynamically -->
        </div>
    </div>

    <!-- Firebase SDKs & App Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnk_ubHwUVK_Z8EScWZufJSPnH4d0a9p8",
            authDomain: "truyenhaygn.firebaseapp.com",
            projectId: "truyenhaygn",
            storageBucket: "truyenhaygn.appspot.com",
            messagingSenderId: "608010144020",
            appId: "1:608010144020:web:3a7965447f7c74246bda01",
            measurementId: "G-JQ54X4X0C8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUser = null;
        window.currentProfile = null;
        window.currentView = 'home';
        window.historyStack = [];
        window.systemConfig = {
            adLink: "https://google.com",
            adRewardCoins: 20,
            dailyCheckinCoins: 50
        };

        window.fbSignIn = signInWithEmailAndPassword;
        window.fbCreateUser = createUserWithEmailAndPassword;
        window.fbSignOut = signOut;
        window.db = db;
        window.auth = auth;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;

        async function loadSystemConfig() {
            try {
                const sysDoc = await getDoc(doc(db, "settings", "system"));
                if (sysDoc.exists()) {
                    window.systemConfig = { ...window.systemConfig, ...sysDoc.data() };
                }
            } catch(e) {}
        }
        loadSystemConfig();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    window.currentProfile = userSnap.data();
                    if (!window.currentProfile.unlockedChapters) window.currentProfile.unlockedChapters = [];
                } else {
                    const isQuanLy = user.email === 'quanly@storyverse.internal';
                    window.currentProfile = {
                        uid: user.uid,
                        username: isQuanLy ? 'quanly' : user.email.split('@')[0],
                        displayName: isQuanLy ? 'Quản Lý' : user.email.split('@')[0],
                        coins: isQuanLy ? 999999 : 100,
                        reputation: isQuanLy ? 2000000 : 0,
                        bgUrl: '',
                        role: isQuanLy ? 'admin' : 'author',
                        hearts: isQuanLy ? 2000000 : 0,
                        dailyCoinExchanges: 0,
                        lastExchangeDate: '',
                        lastCheckinDate: '',
                        viewedStories: [],
                        unlockedChapters: []
                    };
                    await setDoc(userDocRef, window.currentProfile);
                }
            } else {
                window.currentUser = null;
                window.currentProfile = null;
            }
            renderNavbar();
            renderHome();
        });

        window.handleLoginSubmit = async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            let emailToUse = identifier;

            if (identifier === 'quanly') {
                emailToUse = 'quanly@storyverse.internal';
            } else if (!identifier.includes('@')) {
                emailToUse = identifier + '@storyverse.internal';
            }

            try {
                await window.fbSignIn(window.auth, emailToUse, pass);
                alert("Đăng nhập thành công!");
                switchView('home');
            } catch (err) {
                if (identifier === 'quanly' && (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) {
                    try {
                        const cred = await window.fbCreateUser(window.auth, emailToUse, pass);
                        const adminProfile = {
                            uid: cred.user.uid,
                            username: 'quanly',
                            displayName: 'Quản Lý',
                            coins: 999999,
                            reputation: 2000000,
                            bgUrl: '',
                            role: 'admin',
                            hearts: 2000000,
                            dailyCoinExchanges: 0,
                            lastExchangeDate: '',
                            lastCheckinDate: '',
                            viewedStories: [],
                            unlockedChapters: []
                        };
                        await window.setDoc(window.doc(window.db, "users", cred.user.uid), adminProfile);
                        alert("Khởi tạo tài khoản Quản Lý thành công!");
                        switchView('home');
                        return;
                    } catch (createErr) {
                        alert("Lỗi khởi tạo quản lý: " + createErr.message);
                        return;
                    }
                }
                alert("Đăng nhập thất bại: " + err.message);
            }
        };

        window.handleRegisterSubmit = async function(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const emailInput = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (username === 'quanly') {
                alert("Tên tài khoản này dành riêng cho Quản Lý!");
                return;
            }

            try {
                const q = window.query(window.collection(window.db, "users"), window.where("username", "==", username));
                const snap = await window.getDocs(q);
                if (!snap.empty) {
                    alert("Tên đăng nhập đã tồn tại! Vui lòng chọn tên khác.");
                    return;
                }

                const emailToUse = emailInput.includes('@') ? emailInput : username + '@storyverse.internal';
                const cred = await window.fbCreateUser(window.auth, emailToUse, pass);
                
                const userProfile = {
                    uid: cred.user.uid,
                    username: username,
                    displayName: username,
                    coins: 100,
                    reputation: 0,
                    bgUrl: '',
                    role: 'author',
                    hearts: 0,
                    dailyCoinExchanges: 0,
                    lastExchangeDate: '',
                    lastCheckinDate: '',
                    viewedStories: [],
                    unlockedChapters: []
                };
                await window.setDoc(window.doc(window.db, "users", cred.user.uid), userProfile);
                alert("Đăng ký tài khoản thành công!");
                switchView('home');
            } catch (err) {
                alert("Đăng ký thất bại: " + err.message);
            }
        };

        window.handleLogout = async function() {
            await window.fbSignOut(window.auth);
            switchView('home');
        };
    </script>

    <!-- App Logic Scripts -->
    <script>
        function switchView(viewName, params = {}) {
            window.historyStack.push({ view: window.currentView, params: window.currentParams || {} });
            window.currentView = viewName;
            window.currentParams = params;
            document.getElementById('backBtn').classList.remove('hidden');
            renderCurrentView();
        }

        function goBack() {
            if (window.historyStack.length > 0) {
                const prev = window.historyStack.pop();
                window.currentView = prev.view;
                window.currentParams = prev.params;
                if (window.historyStack.length === 0) {
                    document.getElementById('backBtn').classList.add('hidden');
                }
                renderCurrentView();
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function showCustomModal(htmlContent) {
            const container = document.getElementById('customModalContainer');
            const box = document.getElementById('customModalBox');
            box.innerHTML = htmlContent;
            container.classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModalContainer').classList.add('hidden');
        }

        function renderCurrentView() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = '';
            switch(window.currentView) {
                case 'home': renderHome(); break;
                case 'auth': renderAuthPage(); break;
                case 'studio': renderStudioPage(); break;
                case 'create-story': renderCreateStoryPage(); break;
                case 'story-detail': renderStoryDetailPage(window.currentParams.storyId); break;
                case 'read-chapter': renderReadChapterPage(window.currentParams.storyId, window.currentParams.chapterIndex); break;
                case 'author-profile': renderAuthorProfilePage(window.currentParams.authorId); break;
                case 'messages': renderMessagesPage(); break;
                case 'coins': renderCoinsPage(); break;
                case 'admin-panel': renderAdminPanel(); break;
                default: renderHome();
            }
        }

        function renderNavbar() {
            const nav = document.getElementById('authNavSection');
            if (!window.currentUser || !window.currentProfile) {
                nav.innerHTML = `
                    <button onclick="switchView('auth')" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 px-4 py-2 rounded-xl text-sm font-bold shadow-md transition">Đăng nhập / Đăng ký</button>
                `;
            } else {
                const p = window.currentProfile;
                const isAdmin = p.username === 'quanly';
                nav.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button onclick="switchView('coins')" class="bg-yellow-600/20 border border-yellow-500 text-yellow-400 px-2.5 py-1 rounded-full text-xs font-bold flex items-center space-x-1 shadow-sm hover:bg-yellow-600/30 transition">
                            <i class="fas fa-coins"></i> <span>${p.coins} Xu</span>
                        </button>
                        <button onclick="switchView('messages')" class="relative text-gray-300 hover:text-white px-2 py-1 transition">
                            <i class="fas fa-envelope text-lg"></i>
                        </button>
                        <button onclick="switchView('studio')" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1">
                            <i class="fas fa-feather text-purple-400"></i> <span>Studio</span>
                        </button>
                        ${isAdmin ? `<button onclick="switchView('admin-panel')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition text-white shadow-md">Quản lý</button>` : ''}
                        <div class="flex items-center space-x-1 cursor-pointer pl-1" onclick="switchView('author-profile', {authorId: '${p.uid}'})">
                            <img src="${p.bgUrl || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover border-2 border-purple-500 shadow-sm">
                            <span class="text-xs font-bold ${isAdmin ? 'badge-huyen-thoai text-red-500' : getRankClass(p.reputation)}">
                                ${p.displayName || p.username} ${isAdmin ? '<i class="fas fa-check-circle text-blue-500"></i>' : ''}
                            </span>
                        </div>
                        <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 text-xs px-1 transition"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                `;
            }
        }

        function getRankClass(rep) {
            if (rep >= 1000000) return 'badge-huyen-thoai';
            if (rep >= 100000) return 'badge-kimcuong';
            if (rep >= 10000) return 'badge-vang';
            if (rep >= 1000) return 'badge-bac';
            if (rep >= 100) return 'badge-dong';
            return 'text-gray-200';
        }

        function getRankName(rep) {
            if (rep >= 1000000) return 'Huyền thoại';
            if (rep >= 100000) return 'Kim cương';
            if (rep >= 10000) return 'Vàng';
            if (rep >= 1000) return 'Bạc';
            if (rep >= 100) return 'Đồng';
            return 'Tập sự';
        }

        async function renderHome() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-900 via-indigo-900 to-gray-800 p-6 md:p-8 rounded-3xl shadow-2xl border border-purple-500/20 flex flex-col md:flex-row justify-between items-center">
                        <div class="space-y-2">
                            <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">Thế Giới Sáng Tác & Đọc Truyện</h2>
                            <p class="text-purple-200 text-sm">Đồng bộ dữ liệu thời gian thực mượt mà giữa Điện thoại và Máy tính.</p>
                        </div>
                        <button onclick="switchView('create-story')" class="mt-4 md:mt-0 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white px-6 py-3.5 rounded-2xl font-extrabold shadow-lg transition transform hover:-translate-y-0.5 flex items-center space-x-2">
                            <i class="fas fa-plus-circle text-lg"></i> <span>Viết Truyện Ngay</span>
                        </button>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-4 text-purple-300 flex items-center"><i class="fas fa-fire text-red-500 mr-2"></i> Tác phẩm nổi bật</h3>
                        <div id="storyListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                            <p class="text-gray-400">Đang tải tác phẩm...</p>
                        </div>
                    </div>
                </div>
            `;
            loadStories();
        }

        async function loadStories(filterQuery = '') {
            const container = document.getElementById('storyListContainer');
            try {
                const snap = await window.getDocs(window.collection(window.db, "stories"));
                if (snap.empty) {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-10 bg-gray-800/50 rounded-2xl">Chưa có tác phẩm nào được đăng.</p>`;
                    return;
                }
                let html = '';
                snap.forEach(docSnap => {
                    const s = docSnap.data();
                    const sId = docSnap.id;
                    const searchStr = `${s.title} ${s.genre} ${s.type} ${s.authorName}`.toLowerCase();
                    if (filterQuery && !searchStr.includes(filterQuery.toLowerCase())) return;

                    html += `
                        <div onclick="switchView('story-detail', {storyId: '${sId}'})" class="bg-gray-800 rounded-2xl overflow-hidden shadow-lg hover:shadow-purple-500/20 transition cursor-pointer border border-gray-700/80 flex flex-col group">
                            <div class="h-48 bg-cover bg-center group-hover:scale-105 transition duration-300" style="background-image: url('${s.coverUrl || 'https://via.placeholder.com/300'}')"></div>
                            <div class="p-4 flex flex-col flex-grow relative" style="background-image: url('${s.bgUrl || ''}'); background-size: cover;">
                                <div class="bg-gray-900/90 backdrop-blur-sm p-3 rounded-xl flex-grow flex flex-col">
                                    <span class="text-xs text-pink-400 font-bold uppercase tracking-wider mb-1">${s.genre} • ${s.type}</span>
                                    <h4 class="text-base font-extrabold text-white truncate mb-1 group-hover:text-purple-400 transition">${s.title}</h4>
                                    <p class="text-xs text-gray-400 mb-2" onclick="event.stopPropagation(); switchView('author-profile', {authorId: '${s.authorId}'})">Tác giả: <span class="text-purple-300 font-semibold underline">${s.authorName}</span></p>
                                    <p class="text-xs text-gray-300 line-clamp-2 mb-3 flex-grow">${s.description}</p>
                                    <div class="flex justify-between items-center text-xs text-gray-400 border-t border-gray-700/80 pt-2">
                                        <span><i class="fas fa-heart text-red-500 mr-1"></i> ${s.hearts || 0}</span>
                                        <span><i class="fas fa-coins text-yellow-400 mr-1"></i> ${s.collectedCoins || 0} xu</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || `<p class="text-gray-400 col-span-full text-center py-10 bg-gray-800/50 rounded-2xl">Không tìm thấy tác phẩm phù hợp.</p>`;
            } catch (e) {
                container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">Lỗi tải danh sách tác phẩm.</p>`;
            }
        }

        function handleGlobalSearch(val) { loadStories(val); }

        function renderAuthPage() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-700 mt-8">
                    <div class="flex border-b border-gray-700 mb-6">
                        <button onclick="toggleAuthTab('login')" id="loginTabBtn" class="w-1/2 pb-3 font-extrabold text-purple-400 border-b-2 border-purple-500">Đăng Nhập</button>
                        <button onclick="toggleAuthTab('register')" id="registerTabBtn" class="w-1/2 pb-3 font-extrabold text-gray-400">Đăng Ký</button>
                    </div>
                    <div id="authFormContainer">
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                                <input type="text" id="loginEmail" required class="w-full bg-gray-700/80 border border-gray-600 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                                <input type="password" id="loginPassword" required class="w-full bg-gray-700/80 border border-gray-600 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg">Đăng Nhập</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function toggleAuthTab(tab) {
            const container = document.getElementById('authFormContainer');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');
            if (tab === 'login') {
                loginBtn.className = "w-1/2 pb-3 font-extrabold text-purple-400 border-b-2 border-purple-500";
                regBtn.className = "w-1/2 pb-3 font-extrabold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>

        async function loadMyStories() {
            const container = document.getElementById('myStoriesContainer');
            try {
                const q = window.query(window.collection(window.db, "stories"), window.where("authorId", "==", window.currentUser.uid));
                const snap = await window.getDocs(q);
                if (snap.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-xs py-4 text-center">Bạn chưa sáng tác tác phẩm nào.</p>`;
                    return;
                }
                let html = '';
                snap.forEach(docSnap => {
                    const s = docSnap.data();
                    const id = docSnap.id;
                    const collected = s.collectedCoins || 0;
                    html += `
                        <div class="bg-gray-700/50 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center border border-gray-600/80 gap-3">
                            <div>
                                <h4 class="font-bold text-white text-sm cursor-pointer hover:text-purple-400 transition" onclick="switchView('story-detail', {storyId: '${id}'})">${s.title}</h4>
                                <p class="text-xs text-gray-400 mt-1">${s.genre} • ${s.type} | Tim: ${s.hearts || 0}</p>
                                <p class="text-xs text-yellow-400 font-bold mt-0.5">💰 Tích lũy tác phẩm: ${collected} Xu</p>
                            </div>
                            <div class="flex flex-wrap gap-1.5 w-full sm:w-auto">
                                ${collected > 0 ? `<button onclick="collectCoinsFromStory('${id}', ${collected})" class="bg-yellow-600 hover:bg-yellow-700 px-2.5 py-1.5 rounded-lg text-xs font-bold text-white transition"><i class="fas fa-hand-holding-usd mr-1"></i> Rút Xu</button>` : ''}
                                <button onclick="openEditStoryBgModal('${id}')" class="bg-indigo-600 hover:bg-indigo-700 px-2.5 py-1.5 rounded-lg text-xs text-white transition"><i class="fas fa-image mr-1"></i> Đổi Nền</button>
                                <button onclick="openAddChapterModalProfessional('${id}')" class="bg-green-600 hover:bg-green-700 px-2.5 py-1.5 rounded-lg text-xs text-white transition font-bold"><i class="fas fa-plus mr-1"></i> Thêm Chương</button>
                                <button onclick="deleteStory('${id}')" class="bg-red-600 hover:bg-red-700 px-2.5 py-1.5 rounded-lg text-xs text-white transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p class="text-red-400 text-xs">Lỗi tải tác phẩm.</p>`;
            }
        }

        async function collectCoinsFromStory(storyId, amount) {
            if (amount <= 0) return;
            try {
                window.currentProfile.coins += amount;
                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    coins: window.currentProfile.coins
                });

                await window.updateDoc(window.doc(window.db, "stories", storyId), {
                    collectedCoins: 0
                });

                alert(`🎉 Bạn đã rút thành công +${amount} Xu từ tác phẩm về ví cá nhân!`);
                renderNavbar();
                renderStudioPage();
            } catch(e) { alert("Lỗi rút xu: " + e.message); }
        }

        async function loadHistoryStories() {
            const container = document.getElementById('historyStoriesContainer');
            const viewed = window.currentProfile.viewedStories || [];
            if (viewed.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-xs py-4 text-center">Chưa có lịch sử xem.</p>`;
                return;
            }
            let html = '';
            for (let id of viewed) {
                try {
                    const docSnap = await window.getDoc(window.doc(window.db, "stories", id));
                    if (docSnap.exists()) {
                        const s = docSnap.data();
                        html += `
                            <div class="bg-gray-700/50 p-3 rounded-xl flex justify-between items-center border border-gray-600/80 cursor-pointer hover:bg-gray-700 transition" onclick="switchView('story-detail', {storyId: '${id}'})">
                                <span class="font-bold text-white text-xs truncate">${s.title}</span>
                                <span class="text-xs text-purple-300 font-semibold">${s.genre}</span>
                            </div>
                        `;
                    }
                } catch(e){}
            }
            container.innerHTML = html || `<p class="text-gray-400 text-xs py-4 text-center">Chưa có lịch sử xem.</p>`;
        }

            try {

        async function handleCreateStorySubmit(e) {
            e.preventDefault();
            const title = document.getElementById('storyTitle').value.trim();
            const type = document.getElementById('storyType').value;
            const genre = document.getElementById('storyGenre').value;
            const description = document.getElementById('storyDesc').value.trim();

            const coverFileInput = document.getElementById('storyCoverFile');
            const bgFileInput = document.getElementById('storyBgFile');

            let coverUrl = 'https://via.placeholder.com/300x400?text=Truyen+Hay+GN';
            let bgUrl = '';

            if (coverFileInput.files[0]) coverUrl = await fileToBase64(coverFileInput.files[0]);
            if (bgFileInput.files[0]) bgUrl = await fileToBase64(bgFileInput.files[0]);

            try {
                const newStory = {
                    title, type, genre, coverUrl, bgUrl, description,
                    authorId: window.currentUser.uid,
                    authorName: window.currentProfile.displayName || window.currentProfile.username,
                    hearts: 0,
                    collectedCoins: 0,
                    chapters: [
                        { title: "Chương 1: Mở đầu", content: "Nội dung chương 1 đang cập nhật...", price: 0 }
                    ],
                    createdAt: window.serverTimestamp()
                };
                await window.addDoc(window.collection(window.db, "stories"), newStory);
                alert("Đăng tác phẩm mới thành công!");
                switchView('studio');
            } catch(err) { alert("Lỗi: " + err.message); }
        }

                alert("Đã xóa tác phẩm!");
                renderStudioPage();
            } catch(err) { alert("Lỗi: " + err.message); }
        }

        async function saveChapterFromModal(storyId) {
            const title = document.getElementById('modalChapterTitle').value.trim();
            const price = parseInt(document.getElementById('modalChapterPrice').value) || 0;
            const type = document.getElementById('modalContentType').value;

            if (!title) { alert("Vui lòng nhập tên chương!"); return; }

            let content = '';

            if (type === 'text') {
                content = document.getElementById('modalChapterText').value.trim();
                if (!content) { alert("Vui lòng nhập nội dung chữ!"); return; }
            } else if (type === 'comic') {
                const files = Array.from(document.getElementById('modalComicFiles').files);
                if (files.length === 0) { alert("Vui lòng chọn ít nhất 1 trang ảnh!"); return; }
                let b64s = [];
                for (let f of files) {
                    let b = await fileToBase64(f);
                    b64s.push(b);
                }
                content = b64s.join('\n');
            } else if (type === 'audio') {
                const file = document.getElementById('modalAudioFile').files[0];
                if (!file) { alert("Vui lòng chọn file audio!"); return; }
                content = await fileToBase64(file);
            }

            try {
                const docRef = window.doc(window.db, "stories", storyId);
                const docSnap = await window.getDoc(docRef);
                if (docSnap.exists()) {
                    const story = docSnap.data();
                    const chapters = story.chapters || [];
                    chapters.push({ title, content, price });
                    await window.updateDoc(docRef, { chapters });
                    closeCustomModal();
                    alert("Xuất bản chương mới thành công!");
                    renderStudioPage();
                }
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        async function unlockChapter(storyId, chapterIndex, price, authorId) {
            if (!window.currentUser) { switchView('auth'); return; }
            if (window.currentProfile.username !== 'quanly' && window.currentProfile.coins < price) {
                alert(`Bạn không đủ Xu để mở khóa! Bạn cần thêm ${price - window.currentProfile.coins} Xu.`);
                return;
            }

            try {
                if (window.currentProfile.username !== 'quanly') {
                    window.currentProfile.coins -= price;
                }
                const chapterKey = `${storyId}_ch_${chapterIndex}`;
                let unlockedList = window.currentProfile.unlockedChapters || [];
                if (!unlockedList.includes(chapterKey)) unlockedList.push(chapterKey);
                window.currentProfile.unlockedChapters = unlockedList;

                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    coins: window.currentProfile.coins,
                    unlockedChapters: unlockedList
                });

                const storyRef = window.doc(window.db, "stories", storyId);
                const storySnap = await window.getDoc(storyRef);
                if (storySnap.exists()) {
                    const currentCollected = storySnap.data().collectedCoins || 0;
                    await window.updateDoc(storyRef, {
                        collectedCoins: currentCollected + price
                    });
                }

                alert("🎉 Mở khóa chương thành công!");
                renderNavbar();
                renderReadChapterPage(storyId, chapterIndex);
            } catch(e) { alert("Lỗi mở khóa: " + e.message); }
        }

        function renderChapterContent(content) {
            if (content.startsWith('data:image') || content.startsWith('http') || content.includes('\ndata:image')) {
                let urls = content.split('\n').filter(u => u.trim() !== '');
                let html = '<div class="comic-image-container rounded-xl overflow-hidden shadow-md">';
                urls.forEach(u => { html += `<img src="${u.trim()}" alt="comic page">`; });
                html += '</div>';
                return html;
            }
            if (content.startsWith('data:audio')) {
                return `<audio controls class="w-full my-2"><source src="${content}"></audio>`;
            }
            return content;
        }

        async function likeStory(storyId) {
            if (!window.currentUser) { switchView('auth'); return; }
            try {
                const docRef = window.doc(window.db, "stories", storyId);
                const docSnap = await window.getDoc(docRef);
                if (docSnap.exists()) {
                    const story = docSnap.data();
                    const newHearts = (story.hearts || 0) + 1;
                    await window.updateDoc(docRef, { hearts: newHearts });

                    const authorRef = window.doc(window.db, "users", story.authorId);
                    const authorSnap = await window.getDoc(authorRef);
                    if (authorSnap.exists()) {

            if (!window.currentUser) { switchView('auth'); return; }
            const modalHtml = `
                <div class="flex justify-between items-center border-b border-gray-700 pb-3">

        async function saveDonateStoryCoin(storyId, authorId) {
            const amount = parseInt(document.getElementById('modalDonateAmount').value);
            if (!amount || amount <= 0) { alert("Số xu phải lớn hơn 0!"); return; }
            if (window.currentProfile.username !== 'quanly' && window.currentProfile.coins < amount) {
                alert("Bạn không đủ xu!");
                return;
            }

            try {
                if (window.currentProfile.username !== 'quanly') {
                    window.currentProfile.coins -= amount;
                    await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });
                }
                const storyRef = window.doc(window.db, "stories", storyId);
                const storySnap = await window.getDoc(storyRef);
                if (storySnap.exists()) {
                    await window.updateDoc(storyRef, { collectedCoins: (storySnap.data().collectedCoins || 0) + amount });
                }
                closeCustomModal();
                alert("🎉 Tặng xu thành công!");
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        async function postComment(e, storyId) {
            e.preventDefault();
            if (!window.currentUser) { switchView('auth'); return; }
            const text = document.getElementById('commentInput').value.trim();
            if (!text) return;

            try {
                await window.addDoc(window.collection(window.db, "stories", storyId, "comments"), {
                    authorId: window.currentUser.uid,
                    authorName: window.currentProfile.displayName || window.currentProfile.username,
                    text: text,
                    createdAt: window.serverTimestamp()
                });
                document.getElementById('commentInput').value = '';
                renderStoryDetailPage(storyId);
            } catch(err) { alert("Lỗi: " + err.message); }
        }

        async function deleteComment(storyId, commentId) {
            if (!confirm("Xóa bình luận này?")) return;
            try {
                await window.deleteDoc(window.doc(window.db, "stories", storyId, "comments", commentId));
                renderStoryDetailPage(storyId);
            } catch(e) { alert("Lỗi: " + e.message); }
        }

                        <div onclick="switchView('story-detail', {storyId: '${sId}'})" class="bg-gray-800 p-4 rounded-2xl border border-gray-700 cursor-pointer hover:border-purple-500 transition shadow-md">
                            <h4 class="font-bold text-white">${s.title}</h4>
                            <p class="text-xs text-gray-400 mt-1">${s.genre} • ${s.type} | Tim: ${s.hearts || 0}</p>
                        </div>
                    `;
                });

                content.innerHTML = `
                    <div class="max-w-3xl mx-auto space-y-6">
                        <div class="bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-xl flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-6">
                            <img src="${author.bgUrl || 'https://via.placeholder.com/100'}" class="w-24 h-24 rounded-full object-cover border-4 border-purple-500 shadow-lg">
                            <div class="text-center md:text-left space-y-2 flex-grow">
                                <h2 class="text-2xl font-extrabold ${isAdmin ? 'badge-huyen-thoai text-red-500' : getRankClass(author.reputation)}">
                                    ${author.displayName || author.username} ${isAdmin ? '<i class="fas fa-check-circle text-blue-500"></i>' : ''}
                                </h2>
                                <p class="text-xs text-gray-400">Cấp bậc: <span class="text-purple-300 font-bold">${getRankName(author.reputation)}</span> | Độ nổi tiếng: <span class="text-pink-400 font-bold">${author.reputation}</span></p>
                                <button onclick="donateAuthorDirect('${authorId}')" class="bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-700 hover:to-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-md">
                                    <i class="fas fa-coins mr-1"></i> Tặng Xu Cho Tác Giả
                                </button>
                            </div>
                        </div>

                        <div class="bg-gray-800 p-6 rounded-3xl border border-gray-700 shadow-xl space-y-4">
                            <h3 class="text-lg font-bold text-purple-300">Tác phẩm của ${author.displayName || author.username}</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${storiesHtml || '<p class="text-gray-400 text-xs py-2">Chưa có tác phẩm nào.</p>'}</div>
                        </div>
                    </div>
                `;
            } catch(e) {
                content.innerHTML = `<p class="text-center py-8 text-red-400">Lỗi: ${e.message}</p>`;
            }
        }

        function donateAuthorDirect(authorId) {
            if (!window.currentUser) { switchView('auth'); return; }
            const modalHtml = `
                <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                    <h3 class="text-lg font-bold text-yellow-400"><i class="fas fa-coins mr-2"></i> Tặng Xu Trực Tiếp</h3>
                    <button onclick="closeCustomModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times text-lg"></i></button>
                </div>
                <div class="space-y-4 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Số xu tặng tác giả</label>
                        <input type="number" id="modalDonateDirectAmount" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-sm" value="10">
                    </div>
                    <div class="flex justify-end space-x-2 pt-3 border-t border-gray-700">
                        <button onclick="closeCustomModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs font-bold rounded-xl transition">Hủy</button>
                        <button onclick="saveDonateAuthorDirect('${authorId}')" class="px-5 py-2 bg-yellow-600 hover:bg-yellow-700 text-white text-xs font-bold rounded-xl transition shadow-md">Tặng Xu Ngay</button>
                    </div>
                </div>
            `;
            showCustomModal(modalHtml);
        }

        async function saveDonateAuthorDirect(authorId) {
            const amount = parseInt(document.getElementById('modalDonateDirectAmount').value);
            if (!amount || amount <= 0) { alert("Số xu phải lớn hơn 0!"); return; }
            if (window.currentProfile.username !== 'quanly' && window.currentProfile.coins < amount) {
                alert("Bạn không đủ xu!");
                return;
            }

            try {
                if (window.currentProfile.username !== 'quanly') {
                    window.currentProfile.coins -= amount;
                    await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });
                }
                const authorRef = window.doc(window.db, "users", authorId);
                const aSnap = await window.getDoc(authorRef);
                if (aSnap.exists()) {
                    await window.updateDoc(authorRef, { coins: (aSnap.data().coins || 0) + amount });
                }
                closeCustomModal();
                alert("Tặng xu thành công!");
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        // --- KHO XU & ĐỔI DANH TIẾNG ---
        function renderCoinsPage() {
            if (!window.currentUser) { switchView('auth'); return; }
            const p = window.currentProfile;
            const cfg = window.systemConfig;
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-700 space-y-6 text-center">
                    <h2 class="text-2xl font-extrabold text-yellow-400"><i class="fas fa-coins mr-2"></i> Kho Xu & Nhận Thưởng</h2>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-gray-700/60 p-4 rounded-2xl border border-gray-600">
                            <p class="text-xs text-gray-400">Số xu hiện có</p>
                            <p class="text-2xl font-extrabold text-yellow-400 mt-1">${p.coins} Xu</p>
                        </div>
                        <div class="bg-gray-700/60 p-4 rounded-2xl border border-gray-600">
                            <p class="text-xs text-gray-400">Độ nổi tiếng</p>
                            <p class="text-2xl font-extrabold text-purple-400 mt-1">${p.reputation}</p>
                        </div>
                    </div>

                    <div class="space-y-3 pt-2">
                        <button onclick="handleDailyCheckin()" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-xs flex items-center justify-center space-x-2">
                            <i class="fas fa-calendar-check text-base"></i>
                            <span>Điểm Danh Hằng Ngày (+${cfg.dailyCheckinCoins || 50} Xu)</span>
                        </button>

                        <button onclick="handleWatchAd()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-xs flex items-center justify-center space-x-2">
                            <i class="fas fa-video text-base"></i>
                            <span>Coi Quảng Cáo Nhận Xu (+${cfg.adRewardCoins || 20} Xu)</span>
                        </button>

                        <button onclick="exchangeCoinsToReputation()" class="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-700 hover:to-amber-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-xs flex items-center justify-center space-x-2">
                            <i class="fas fa-star text-base"></i>
                            <span>Đổi 10 Xu = 1 Độ Nổi Tiếng (Tối đa 5 lần/ngày)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        async function handleDailyCheckin() {
            const p = window.currentProfile;
            const today = new Date().toDateString();
            if (p.lastCheckinDate === today) {
                alert("Hôm nay bạn đã điểm danh rồi! Hãy quay lại vào ngày mai nhé.");
                return;
            }
            const reward = window.systemConfig.dailyCheckinCoins || 50;
            p.coins += reward;
            p.lastCheckinDate = today;

            try {
                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    coins: p.coins,
                    lastCheckinDate: p.lastCheckinDate
                });
                alert(`🎉 Điểm danh thành công! Bạn nhận được +${reward} Xu.`);
                renderCoinsPage();
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        async function handleWatchAd() {
            const adUrl = window.systemConfig.adLink || "https://google.com";
            const reward = window.systemConfig.adRewardCoins || 20;

            window.open(adUrl, '_blank');
            
            const p = window.currentProfile;
            p.coins += reward;

            try {
                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    coins: p.coins
                });
                alert(`🎉 Cảm ơn bạn đã xem quảng cáo! +${reward} Xu đã cộng vào tài khoản.`);
                renderCoinsPage();
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        async function exchangeCoinsToReputation() {
            const p = window.currentProfile;
            const today = new Date().toDateString();
            if (p.lastExchangeDate !== today) {
                p.dailyCoinExchanges = 0;
                p.lastExchangeDate = today;
            }
            if (p.dailyCoinExchanges >= 5) {
                alert("Bạn đã đạt giới hạn đổi 5 lần trong ngày!");
                return;
            }
            if (p.username !== 'quanly' && p.coins < 10) {
                alert("Bạn cần ít nhất 10 xu để đổi!");
                return;
            }

            try {
                if (p.username !== 'quanly') p.coins -= 10;
                p.reputation += 1;
                p.dailyCoinExchanges += 1;

                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    coins: p.coins,
                    reputation: p.reputation,
                    dailyCoinExchanges: p.dailyCoinExchanges,
                    lastExchangeDate: p.lastExchangeDate
                });
                alert("Đổi thành công! Nhận thêm 1 độ nổi tiếng.");
                renderCoinsPage();
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        // --- Gửi Thư Tín ---
        async function renderMessagesPage() {
            if (!window.currentUser) { switchView('auth'); return; }
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-2xl mx-auto bg-gray-800 p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-700 space-y-6">
                    <h2 class="text-2xl font-extrabold text-purple-400 border-b border-gray-700 pb-3"><i class="fas fa-envelope mr-2"></i> Hộp Thư Tín</h2>
                    
                    <form onsubmit="sendMessage(event)" class="space-y-4 bg-gray-700/50 p-5 rounded-2xl border border-gray-600">
                        <h3 class="text-sm font-bold text-white">Soạn thư mới</h3>
                        <div>
                            <input type="text" id="msgReceiver" required placeholder="Tên đăng nhập người nhận..." class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs">
                        </div>
                        <div>
                            <textarea id="msgText" rows="2" placeholder="Nội dung lời nhắn..." class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs"></textarea>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Tải ảnh kèm theo</label>
                                <input type="file" id="msgImgFile" accept="image/*" class="w-full bg-gray-700 text-xs text-gray-300 border border-gray-600 rounded-lg p-1">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Tải file ghi âm/Audio</label>
                                <input type="file" id="msgAudioFile" accept="audio/*" class="w-full bg-gray-700 text-xs text-gray-300 border border-gray-600 rounded-lg p-1">
                            </div>
                        </div>
                        <button type="submit" class="bg-purple-600 hover:bg-purple-700 px-5 py-2 rounded-xl text-xs font-bold text-white transition shadow-md">Gửi Thư Tín</button>
                    </form>

                    <div id="messagesListContainer" class="space-y-3">
                        <p class="text-gray-400 text-xs">Đang tải hộp thư...</p>
                    </div>
                </div>
            `;
            loadMessages();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const receiverUsername = document.getElementById('msgReceiver').value.trim().toLowerCase();
            const text = document.getElementById('msgText').value.trim();
            const imgInput = document.getElementById('msgImgFile');
            const audioInput = document.getElementById('msgAudioFile');

            let imageUrl = '';
            let audioUrl = '';

            if (imgInput.files[0]) imageUrl = await fileToBase64(imgInput.files[0]);
            if (audioInput.files[0]) audioUrl = await fileToBase64(audioInput.files[0]);

            try {
                const q = window.query(window.collection(window.db, "users"), window.where("username", "==", receiverUsername));
                const snap = await window.getDocs(q);
                if (snap.empty) {
                    alert("Không tìm thấy tên đăng nhập người nhận!");
                    return;
                }
                let receiverUid = '';
                snap.forEach(d => receiverUid = d.id);

                await window.addDoc(window.collection(window.db, "messages"), {
                    senderId: window.currentUser.uid,
                    senderName: window.currentProfile.displayName || window.currentProfile.username,
                    receiverId: receiverUid,
                    text, imageUrl, audioUrl,
                    createdAt: window.serverTimestamp()
                });
                alert("🎉 Gửi thư tín thành công!");
                renderMessagesPage();
            } catch(err) { alert("Lỗi: " + err.message); }
        }

        async function loadMessages() {
            const container = document.getElementById('messagesListContainer');
            try {
                const q = window.query(window.collection(window.db, "messages"), window.where("receiverId", "==", window.currentUser.uid));
                const snap = await window.getDocs(q);
                if (snap.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-xs py-4 text-center">Hộp thư tín trống.</p>`;
                    return;
                }
                let html = '';
                snap.forEach(docSnap => {
                    const m = docSnap.data();
                    html += `
                        <div class="bg-gray-700/60 p-4 rounded-2xl border border-gray-600 space-y-2">
                            <div class="flex justify-between">
                                <span class="font-bold text-purple-300 text-xs">Từ tác giả: ${m.senderName}</span>
                            </div>
                            ${m.text ? `<p class="text-sm text-gray-200">${m.text}</p>` : ''}
                            ${m.imageUrl ? `<img src="${m.imageUrl}" class="max-h-48 rounded-xl object-cover shadow-md">` : ''}
                            ${m.audioUrl ? `<audio controls class="w-full h-8"><source src="${m.audioUrl}"></audio>` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) { container.innerHTML = `<p class="text-red-400 text-xs">Lỗi tải thư.</p>`; }
        }

        // --- Bảng Điều Khiển Quản Lý (Admin Panel) ---
        function renderAdminPanel() {
            if (!window.currentUser || window.currentProfile.username !== 'quanly') {
                alert("Bạn không có quyền truy cập!");
                switchView('home');
                return;
            }
            const cfg = window.systemConfig;
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-3xl mx-auto bg-gray-800 p-8 rounded-3xl shadow-2xl border border-red-500/50 space-y-6">
                    <h2 class="text-2xl font-extrabold text-red-500 border-b border-gray-700 pb-3 flex items-center">
                        <i class="fas fa-shield-alt mr-2"></i> Bảng Điều Khiển Quản Lý
                    </h2>
                    
                    <form onsubmit="handleUpdateSystemConfig(event)" class="space-y-4 bg-gray-700/50 p-5 rounded-2xl border border-gray-600">
                        <h3 class="font-bold text-white text-sm">Cài đặt Hệ Thống, Quảng Cáo & Giao Diện</h3>
                        
                        <div>
                            <label class="block text-xs font-bold text-yellow-400 mb-1">Link Xem Quảng Cáo</label>
                            <input type="url" id="adminAdLink" required class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs" value="${cfg.adLink || 'https://google.com'}">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-yellow-400 mb-1">Xu Thưởng Coi Quảng Cáo</label>
                                <input type="number" id="adminAdCoins" required class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs" value="${cfg.adRewardCoins || 20}">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-green-400 mb-1">Xu Thưởng Điểm Danh Mỗi Ngày</label>
                                <input type="number" id="adminCheckinCoins" required class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs" value="${cfg.dailyCheckinCoins || 50}">
                            </div>
                        </div>

                        <div class="border-t border-gray-600 pt-3 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Nội dung thanh thông báo</label>
                                <input type="text" id="adminNotifText" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs" value="📢 Chào mừng bạn đến với Truyện hay Gn!">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Màu nền thanh thông báo (Tailwind Class)</label>
                                <input type="text" id="adminNotifBg" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3.5 py-2 text-white text-xs" value="bg-indigo-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Tải ảnh nền trang web từ máy</label>
                                <input type="file" id="adminWebBgFile" accept="image/*" class="w-full bg-gray-700 text-xs text-gray-300 border border-gray-600 rounded-lg p-1">
                            </div>
                        </div>

                        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-lg">Lưu Cài Đặt Hệ Thống</button>
                    </form>
                </div>
            `;
        }

        async function handleUpdateSystemConfig(e) {
            e.preventDefault();
            const text = document.getElementById('adminNotifText').value;
            const bgClass = document.getElementById('adminNotifBg').value;
            const bgFileInput = document.getElementById('adminWebBgFile');

            const adLink = document.getElementById('adminAdLink').value.trim();
            const adRewardCoins = parseInt(document.getElementById('adminAdCoins').value) || 20;
            const dailyCheckinCoins = parseInt(document.getElementById('adminCheckinCoins').value) || 50;

            window.systemConfig = { adLink, adRewardCoins, dailyCheckinCoins };

            try {
                await window.setDoc(window.doc(window.db, "settings", "system"), window.systemConfig);

                document.getElementById('notificationText').innerText = text;
                const bar = document.getElementById('systemNotificationBar');
                bar.className = `${bgClass} text-white px-4 py-2 text-center text-sm font-medium shadow-md transition-all duration-300 flex justify-between items-center`;

                if (bgFileInput.files[0]) {
                    const webBgUrl = await fileToBase64(bgFileInput.files[0]);
                    document.getElementById('mainBody').style.backgroundImage = `url('${webBgUrl}')`;
                    document.getElementById('mainBody').style.backgroundSize = 'cover';
                }
                alert("🎉 Đã lưu cấu hình hệ thống thành công lên Firebase!");
            } catch(err) { alert("Lỗi lưu cấu hình: " + err.message); }
        }

        function closeNotificationBar() {
            document.getElementById('systemNotificationBar').style.display = 'none';
        }
    </script>
</body>
</html>
