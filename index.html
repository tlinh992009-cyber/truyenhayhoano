<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện hay Gn - Nền Tảng Sáng Tác & Đọc Truyện Đa Thiết Bị</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes bronzeGlow { 0% { text-shadow: 0 0 5px #cd7f32; } 50% { text-shadow: 0 0 15px #cd7f32; } 100% { text-shadow: 0 0 5px #cd7f32; } }
        @keyframes silverGlow { 0% { text-shadow: 0 0 5px #c0c0c0; } 50% { text-shadow: 0 0 15px #ffffff; } 100% { text-shadow: 0 0 5px #c0c0c0; } }
        @keyframes goldGlow { 0% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } 50% { text-shadow: 0 0 20px #ffae00; transform: scale(1.02); } 100% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } }
        @keyframes diamondGlow { 0% { text-shadow: 0 0 5px #00ffff; } 50% { text-shadow: 0 0 20px #0088ff; } 100% { text-shadow: 0 0 5px #00ffff; } }
        @keyframes legendGlow { 0% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } 33% { color: #00ff00; text-shadow: 0 0 8px #00ff00; } 66% { color: #0088ff; text-shadow: 0 0 8px #0088ff; } 100% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } }

        .badge-dong { animation: bronzeGlow 2s infinite; color: #cd7f32; font-weight: bold; }
        .badge-bac { animation: silverGlow 2s infinite; color: #e0e0e0; font-weight: bold; }
        .badge-vang { animation: goldGlow 2s infinite; color: #ffd700; font-weight: bold; }
        .badge-kimcuong { animation: diamondGlow 2s infinite; color: #00ffff; font-weight: bold; }
        .badge-huyen-thoai { animation: legendGlow 3s infinite; font-weight: bold; }
        
        .comic-image-container img {
            display: block;
            margin: 0;
            padding: 0;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body id="mainBody" class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Thanh Thông Báo Hệ Thống -->
    <div id="systemNotificationBar" class="bg-indigo-600 text-white px-4 py-2 text-center text-sm font-medium shadow-md transition-all duration-300 flex justify-between items-center">
        <div id="notificationText" class="w-full truncate">📢 Chào mừng bạn đến với Truyện hay Gn! Nền tảng sáng tác và đọc truyện đồng bộ đa thiết bị.</div>
        <button onclick="closeNotificationBar()" class="text-white hover:text-gray-200 ml-4"><i class="fas fa-times"></i></button>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="backBtn" onclick="goBack()" class="hidden bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                    <i class="fas fa-arrow-left"></i> <span>Quay lại</span>
                </button>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent cursor-pointer" onclick="switchView('home')">Truyện hay Gn</h1>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="hidden md:flex items-center space-x-2 bg-gray-700 rounded-lg px-3 py-1.5 w-1/3">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="globalSearchInput" placeholder="Tìm tên truyện, thể loại, kiểu hình, tác giả..." class="bg-transparent border-none focus:outline-none text-sm w-full text-white" oninput="handleGlobalSearch(this.value)">
            </div>

            <div class="flex items-center space-x-3" id="authNavSection">
                <!-- Trạng thái đăng nhập -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4" id="appMainContent">
        <!-- Nội dung động -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-sm text-gray-400">
        <p>&copy; 2026 Truyện hay Gn - Nền tảng Sáng Tác & Đọc Truyện Đa Thiết Bị.</p>
    </footer>

    <!-- Firebase SDKs & App Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnk_ubHwUVK_Z8EScWZufJSPnH4d0a9p8",
            authDomain: "truyenhaygn.firebaseapp.com",
            projectId: "truyenhaygn",
            storageBucket: "truyenhaygn.appspot.com",
            messagingSenderId: "608010144020",
            appId: "1:608010144020:web:3a7965447f7c74246bda01",
            measurementId: "G-JQ54X4X0C8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUser = null;
        window.currentProfile = null;
        window.currentView = 'home';
        window.historyStack = [];

        window.fbSignIn = signInWithEmailAndPassword;
        window.fbCreateUser = createUserWithEmailAndPassword;
        window.fbSignOut = signOut;
        window.db = db;
        window.auth = auth;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    window.currentProfile = userSnap.data();
                } else {
                    const isQuanLy = user.email === 'quanly@storyverse.internal';
                    window.currentProfile = {
                        uid: user.uid,
                        username: isQuanLy ? 'quanly' : user.email.split('@')[0],
                        displayName: isQuanLy ? 'Quản Lý' : user.email.split('@')[0],
                        coins: isQuanLy ? 999999 : 100,
                        reputation: isQuanLy ? 2000000 : 0,
                        bgUrl: '',
                        role: isQuanLy ? 'admin' : 'author',
                        hearts: isQuanLy ? 2000000 : 0,
                        dailyCoinExchanges: 0,
                        lastExchangeDate: '',
                        viewedStories: []
                    };
                    await setDoc(userDocRef, window.currentProfile);
                }
            } else {
                window.currentUser = null;
                window.currentProfile = null;
            }
            renderNavbar();
            renderHome();
        });

        // Đăng nhập
        window.handleLoginSubmit = async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            let emailToUse = identifier;

            if (identifier === 'quanly') {
                emailToUse = 'quanly@storyverse.internal';
            } else if (!identifier.includes('@')) {
                emailToUse = identifier + '@storyverse.internal';
            }

            try {
                await window.fbSignIn(window.auth, emailToUse, pass);
                alert("Đăng nhập thành công!");
                switchView('home');
            } catch (err) {
                if (identifier === 'quanly' && (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) {
                    try {
                        const cred = await window.fbCreateUser(window.auth, emailToUse, pass);
                        const adminProfile = {
                            uid: cred.user.uid,
                            username: 'quanly',
                            displayName: 'Quản Lý',
                            coins: 999999,
                            reputation: 2000000,
                            bgUrl: '',
                            role: 'admin',
                            hearts: 2000000,
                            dailyCoinExchanges: 0,
                            lastExchangeDate: '',
                            viewedStories: []
                        };
                        await window.setDoc(window.doc(window.db, "users", cred.user.uid), adminProfile);
                        alert("Khởi tạo thành công tài khoản Quản Lý!");
                        switchView('home');
                        return;
                    } catch (createErr) {
                        alert("Lỗi khởi tạo quản lý: " + createErr.message);
                        return;
                    }
                }
                alert("Đăng nhập thất bại: " + err.message);
            }
        };

        // Đăng ký
        window.handleRegisterSubmit = async function(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const emailInput = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (username === 'quanly') {
                alert("Tên tài khoản này dành riêng cho Quản Lý!");
                return;
            }

            try {
                const q = window.query(window.collection(window.db, "users"), window.where("username", "==", username));
                const snap = await window.getDocs(q);
                if (!snap.empty) {
                    alert("Tên đăng nhập đã tồn tại! Vui lòng chọn tên khác.");
                    return;
                }

                const emailToUse = emailInput.includes('@') ? emailInput : username + '@storyverse.internal';
                const cred = await window.fbCreateUser(window.auth, emailToUse, pass);
                
                const userProfile = {
                    uid: cred.user.uid,
                    username: username,
                    displayName: username,
                    coins: 100,
                    reputation: 0,
                    bgUrl: '',
                    role: 'author',
                    hearts: 0,
                    dailyCoinExchanges: 0,
                    lastExchangeDate: '',
                    viewedStories: []
                };
                await window.setDoc(window.doc(window.db, "users", cred.user.uid), userProfile);
                alert("Đăng ký tài khoản thành công!");
                switchView('home');
            } catch (err) {
                alert("Đăng ký thất bại: " + err.message);
            }
        };

        window.handleLogout = async function() {
            await window.fbSignOut(window.auth);
            switchView('home');
        };
    </script>

    <!-- App Logic Scripts -->
    <script>
        function switchView(viewName, params = {}) {
            window.historyStack.push({ view: window.currentView, params: window.currentParams || {} });
            window.currentView = viewName;
            window.currentParams = params;
            document.getElementById('backBtn').classList.remove('hidden');
            renderCurrentView();
        }

        function goBack() {
            if (window.historyStack.length > 0) {
                const prev = window.historyStack.pop();
                window.currentView = prev.view;
                window.currentParams = prev.params;
                if (window.historyStack.length === 0) {
                    document.getElementById('backBtn').classList.add('hidden');
                }
                renderCurrentView();
            }
        }

        function renderCurrentView() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = '';
            switch(window.currentView) {
                case 'home': renderHome(); break;
                case 'auth': renderAuthPage(); break;
                case 'studio': renderStudioPage(); break;
                case 'create-story': renderCreateStoryPage(); break;
                case 'read-story': renderReadStoryPage(window.currentParams.storyId); break;
                case 'author-profile': renderAuthorProfilePage(window.currentParams.authorId); break;
                case 'messages': renderMessagesPage(); break;
                case 'coins': renderCoinsPage(); break;
                case 'admin-panel': renderAdminPanel(); break;
                default: renderHome();
            }
        }

        function renderNavbar() {
            const nav = document.getElementById('authNavSection');
            if (!window.currentUser || !window.currentProfile) {
                nav.innerHTML = `
                    <button onclick="switchView('auth')" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition">Đăng nhập / Đăng ký</button>
                `;
            } else {
                const p = window.currentProfile;
                const isAdmin = p.username === 'quanly';
                nav.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button onclick="switchView('coins')" class="bg-yellow-600/20 border border-yellow-500 text-yellow-400 px-2.5 py-1 rounded-full text-xs font-bold flex items-center space-x-1">
                            <i class="fas fa-coins"></i> <span>${p.coins} Xu</span>
                        </button>
                        <button onclick="switchView('messages')" class="relative text-gray-300 hover:text-white px-2">
                            <i class="fas fa-envelope text-lg"></i>
                        </button>
                        <button onclick="switchView('studio')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                            <i class="fas fa-book-open mr-1"></i> Tủ truyện
                        </button>
                        ${isAdmin ? `<button onclick="switchView('admin-panel')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition text-white">Quản lý</button>` : ''}
                        <div class="flex items-center space-x-1 cursor-pointer" onclick="switchView('author-profile', {authorId: '${p.uid}'})">
                            <img src="${p.bgUrl || 'https://via.placeholder.com/40'}" class="w-7 h-7 rounded-full object-cover border border-purple-500">
                            <span class="text-xs font-semibold ${isAdmin ? 'badge-huyen-thoai text-red-500' : getRankClass(p.reputation)}">
                                ${p.displayName || p.username} ${isAdmin ? '<i class="fas fa-check-circle text-blue-500"></i>' : ''}
                            </span>
                        </div>
                        <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 text-xs px-1"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                `;
            }
        }

        function getRankClass(rep) {
            if (rep >= 1000000) return 'badge-huyen-thoai';
            if (rep >= 100000) return 'badge-kimcuong';
            if (rep >= 10000) return 'badge-vang';
            if (rep >= 1000) return 'badge-bac';
            if (rep >= 100) return 'badge-dong';
            return 'text-gray-200';
        }

        function getRankName(rep) {
            if (rep >= 1000000) return 'Huyền thoại';
            if (rep >= 100000) return 'Kim cương';
            if (rep >= 10000) return 'Vàng';
            if (rep >= 1000) return 'Bạc';
            if (rep >= 100) return 'Đồng';
            return 'Tập sự';
        }

        // --- Trang Chủ ---
        async function renderHome() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-800 to-indigo-900 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-extrabold text-white mb-2">Thế Giới Sáng Tác & Đọc Truyện</h2>
                            <p class="text-purple-200 text-sm">Đồng bộ trực tuyến hoàn hảo giữa điện thoại và máy tính.</p>
                        </div>
                        <button onclick="switchView('create-story')" class="mt-4 md:mt-0 bg-pink-600 hover:bg-pink-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition">Viết Truyện Ngay</button>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-4 text-purple-300">Tác phẩm nổi bật</h3>
                        <div id="storyListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <p class="text-gray-400">Đang tải tác phẩm...</p>
                        </div>
                    </div>
                </div>
            `;
            loadStories();
        }

        async function loadStories(filterQuery = '') {
            const container = document.getElementById('storyListContainer');
            try {
                const snap = await window.getDocs(window.collection(window.db, "stories"));
                if (snap.empty) {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">Chưa có tác phẩm nào.</p>`;
                    return;
                }
                let html = '';
                snap.forEach(docSnap => {
                    const s = docSnap.data();
                    const sId = docSnap.id;
                    const searchStr = `${s.title} ${s.genre} ${s.type} ${s.authorName}`.toLowerCase();
                    if (filterQuery && !searchStr.includes(filterQuery.toLowerCase())) return;

                    html += `
                        <div onclick="switchView('read-story', {storyId: '${sId}'})" class="bg-gray-800 rounded-xl overflow-hidden shadow-md hover:shadow-purple-500/20 transition cursor-pointer border border-gray-700 flex flex-col">
                            <div class="h-44 bg-cover bg-center" style="background-image: url('${s.coverUrl || 'https://via.placeholder.com/300'}')"></div>
                            <div class="p-4 flex flex-col flex-grow" style="background-image: url('${s.bgUrl || ''}'); background-size: cover;">
                                <span class="text-xs text-pink-400 font-semibold mb-1 uppercase">${s.genre} • ${s.type}</span>
                                <h4 class="text-lg font-bold text-white truncate">${s.title}</h4>
                                <p class="text-xs text-gray-400 mb-2" onclick="event.stopPropagation(); switchView('author-profile', {authorId: '${s.authorId}'})">Tác giả: <span class="text-purple-400 underline">${s.authorName}</span></p>
                                <p class="text-xs text-gray-300 line-clamp-2 mb-4 flex-grow">${s.description}</p>
                                <div class="flex justify-between items-center text-xs text-gray-400 border-t border-gray-700 pt-2">
                                    <span><i class="fas fa-heart text-red-500 mr-1"></i> ${s.hearts || 0} tim</span>
                                    <span><i class="fas fa-coins text-yellow-500 mr-1"></i> ${s.collectedCoins || 0} xu</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || `<p class="text-gray-400 col-span-full text-center py-8">Không tìm thấy tác phẩm phù hợp.</p>`;
            } catch (e) {
                container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">Lỗi tải danh sách tác phẩm.</p>`;
            }
        }

        function handleGlobalSearch(val) {
            loadStories(val);
        }

        // --- Trang Đăng Nhập / Đăng Ký ---
        function renderAuthPage() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 mt-10">
                    <div class="flex border-b border-gray-700 mb-6">
                        <button onclick="toggleAuthTab('login')" id="loginTabBtn" class="w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500">Đăng Nhập</button>
                        <button onclick="toggleAuthTab('register')" id="registerTabBtn" class="w-1/2 pb-3 font-bold text-gray-400">Đăng Ký</button>
                    </div>
                    <div id="authFormContainer">
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                                <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                                <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function toggleAuthTab(tab) {
            const container = document.getElementById('authFormContainer');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');
            if (tab === 'login') {
                loginBtn.className = "w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500";
                regBtn.className = "w-1/2 pb-3 font-bold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                            <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                            <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                    </form>
                `;
            } else {
                regBtn.className = "w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500";
                loginBtn.className = "w-1/2 pb-3 font-bold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập (Duy nhất)</label>
                            <input type="text" id="regUsername" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Email</label>
                            <input type="email" id="regEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                            <input type="password" id="regPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Ký</button>
                    </form>
                `;
            }
        }

        // --- Trang Sáng Tác & Tủ Truyện (Studio) ---
        function renderStudioPage() {
            if (!window.currentUser) { switchView('auth'); return; }
            const p = window.currentProfile;
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 flex flex-col md:flex-row justify-between items-center">
                        <div class="flex items-center space-x-4">

        async function loadMyStories() {
            const container = document.getElementById('myStoriesContainer');
            try {
                const q = window.query(window.collection(window.db, "stories"), window.where("authorId", "==", window.currentUser.uid));
                const snap = await window.getDocs(q);
                if (snap.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-sm">Bạn chưa sáng tác tác phẩm nào.</p>`;
                    return;
                }
                let html = '';
                snap.forEach(docSnap => {
                    const s = docSnap.data();
                    const id = docSnap.id;
                    html += `
                        <div class="bg-gray-700/50 p-3 rounded-xl flex justify-between items-center border border-gray-600">
                            <div>
                                <h4 class="font-bold text-white text-sm cursor-pointer hover:text-purple-400" onclick="switchView('read-story', {storyId: '${id}'})">${s.title}</h4>
                                <p class="text-xs text-gray-400">${s.genre} • ${s.type} | Tim: ${s.hearts || 0}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="openAddChapterModal('${id}')" class="bg-green-600 hover:bg-green-700 px-2.5 py-1 rounded text-xs text-white">Thêm chương</button>
                                <button onclick="deleteStory('${id}')" class="bg-red-600 hover:bg-red-700 px-2.5 py-1 rounded text-xs text-white">Xóa</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p class="text-red-400 text-sm">Lỗi tải tác phẩm.</p>`;
            }
        }

        async function loadHistoryStories() {
            const container = document.getElementById('historyStoriesContainer');
            const viewed = window.currentProfile.viewedStories || [];
            if (viewed.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-sm">Chưa có lịch sử xem.</p>`;
                return;
            }
            let html = '';
            for (let id of viewed) {
                try {
                    const docSnap = await window.getDoc(window.doc(window.db, "stories", id));
                    if (docSnap.exists()) {
                        const s = docSnap.data();
                        html += `
                            <div class="bg-gray-700/50 p-3 rounded-xl flex justify-between items-center border border-gray-600 cursor-pointer hover:bg-gray-700" onclick="switchView('read-story', {storyId: '${id}'})">
                                <span class="font-bold text-white text-sm truncate">${s.title}</span>
                                <span class="text-xs text-purple-300">${s.genre}</span>
                            </div>
                        `;
                    }
                } catch(e){}
            }
            container.innerHTML = html || `<p class="text-gray-400 text-sm">Chưa có lịch sử xem.</p>`;
        }

        async function handleCreateStorySubmit(e) {
            e.preventDefault();

            const type = document.getElementById('storyType').value;
            const genre = document.getElementById('storyGenre').value;
            const coverUrl = document.getElementById('storyCover').value.trim();

            const description = document.getElementById('storyDesc').value.trim();

                    ],
                    createdAt: window.serverTimestamp()

        async function openAddChapterModal(storyId) {
            const chTitle = prompt("Nhập tên chương:");
            if (!chTitle) return;
            const chContent = prompt("Nhập nội dung chương (Đối với truyện tranh: dán link ảnh phân cách bằng xuống dòng. Không có khoảng trắng):");
            if (!chContent) return;
            const price = parseInt(prompt("Nhập giá xu mở khóa chương (0 nếu đọc miễn phí):", "0")) || 0;

            try {
                const docRef = window.doc(window.db, "stories", storyId);
                const docSnap = await window.getDoc(docRef);
                if (docSnap.exists()) {
                    const story = docSnap.data();
                    const chapters = story.chapters || [];
                    chapters.push({ title: chTitle, content: chContent, price: price });
                    await window.updateDoc(docRef, { chapters: chapters });
                    alert("Thêm chương thành công!");
                }
            } catch(err) {
                alert("Lỗi: " + err.message);
            }
        }

        // --- Trang Đọc Truyện & Bình Luận & Mở Khóa Chương ---

                const docSnap = await window.getDoc(docRef);

                    content.innerHTML = `<p class="text-center py-8 text-red-400">Không tìm thấy truyện!</p>`;
                    return;
                }
                const story = docSnap.data();

                // Lưu vào lịch sử xem
                if (window.currentUser) {
                    const userRef = window.doc(window.db, "users", window.currentUser.uid);
                    let viewed = window.currentProfile.viewedStories || [];
                    if (!viewed.includes(storyId)) {
                        viewed.unshift(storyId);
                        if (viewed.length > 20) viewed.pop();
                        window.currentProfile.viewedStories = viewed;
                        await window.updateDoc(userRef, { viewedStories: viewed });
                    }
                }

                // Tải danh sách bình luận
                const commSnap = await window.getDocs(window.query(window.collection(window.db, "stories", storyId, "comments"), window.orderBy("createdAt", "desc")));
                let commentsHtml = '';
                commSnap.forEach(cDoc => {
                    const c = cDoc.data();
                    const cId = cDoc.id;
                    const canDelete = window.currentProfile && (window.currentProfile.username === 'quanly' || c.authorId === window.currentUser?.uid);
                    commentsHtml += `
                        <div class="bg-gray-700/40 p-3 rounded-lg flex justify-between items-start border border-gray-600">
                            <div>
                                <span class="font-bold text-purple-300 text-xs">${c.authorName}</span>
                                <p class="text-sm text-gray-200 mt-1">${c.text}</p>
                            </div>
                            ${canDelete ? `<button onclick="deleteComment('${storyId}', '${cId}')" class="text-red-400 text-xs hover:underline">Xóa</button>` : ''}
                        </div>
                    `;
                });

                let chaptersHtml = '';
                (story.chapters || []).forEach((ch, idx) => {
                    chaptersHtml += `
                        <div class="bg-gray-700 p-4 rounded-xl border border-gray-600 space-y-2">
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-white">${ch.title}</h4>

                                ${renderChapterContent(ch.content, ch.price)}
                            </div>
                        </div>
                    `;
                });

                content.innerHTML = `
                    <div class="max-w-4xl mx-auto space-y-6" style="background-image: url('${story.bgUrl || ''}'); background-size: cover; padding: 20px; border-radius: 15px;">
                        <div class="bg-gray-800/90 backdrop-blur p-6 rounded-2xl border border-gray-700 flex flex-col md:flex-row gap-6">
                            <img src="${story.coverUrl}" class="w-full md:w-48 h-64 object-cover rounded-xl shadow-md">
                            <div class="space-y-3 flex-grow">
                                <span class="bg-purple-600/30 text-purple-300 px-3 py-1 rounded-full text-xs font-bold">${story.genre} • ${story.type}</span>
                                <h2 class="text-3xl font-extrabold text-white">${story.title}</h2>
                                <p class="text-sm text-gray-300 cursor-pointer" onclick="switchView('author-profile', {authorId: '${story.authorId}'})">Tác giả: <span class="text-purple-400 font-semibold underline">${story.authorName}</span></p>
                                <p class="text-sm text-gray-300">${story.description}</p>
                                <div class="flex space-x-3 pt-2">
                                    <button onclick="likeStory('${storyId}')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-1">

                                    </button>
                                    <button onclick="donateStoryCoin('${storyId}', '${story.authorId}')" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-1">

                            <div class="space-y-4">${chaptersHtml}</div>
                        </div>

                        <!-- Bình luận -->
                        <div class="bg-gray-800/90 backdrop-blur p-6 rounded-2xl border border-gray-700 space-y-4">
                            <h3 class="text-xl font-bold text-purple-300 border-b border-gray-700 pb-2">Bình Luận Chương</h3>
                            <form onsubmit="postComment(event, '${storyId}')" class="flex space-x-2">
                                <input type="text" id="commentInput" required placeholder="Viết bình luận..." class="flex-grow bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                                <button type="submit" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-bold text-white">Gửi</button>

            }

        function renderChapterContent(content, price) {
            // Nếu là truyện tranh, ghép sát ảnh không khoảng trắng
            if (content.startsWith('http') || content.includes('\nhttp')) {
                let urls = content.split('\n').filter(u => u.trim() !== '');
                let html = '<div class="comic-image-container">';
                urls.forEach(u => {
                    html += `<img src="${u.trim()}" alt="comic image">`;
                });
                html += '</div>';
                return html;
            }
            return content;
        }

        async function likeStory(storyId) {
            if (!window.currentUser) { switchView('auth'); return; }
            try {
                const docRef = window.doc(window.db, "stories", storyId);
                const docSnap = await window.getDoc(docRef);
                if (docSnap.exists()) {
                    const story = docSnap.data();
                    const newHearts = (story.hearts || 0) + 1;
                    await window.updateDoc(docRef, { hearts: newHearts });

                    // Cộng độ nổi tiếng cho tác giả truyện (1 tim = 1 độ nổi tiếng)
                    const authorRef = window.doc(window.db, "users", story.authorId);
                    const authorSnap = await window.getDoc(authorRef);
                    if (authorSnap.exists()) {
                        const authorRep = authorSnap.data().reputation || 0;
                        await window.updateDoc(authorRef, { reputation: authorRep + 1 });
                    }
                    alert("❤️ Đã thích tác phẩm!");
                    renderReadStoryPage(storyId);
                }
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        async function donateStoryCoin(storyId, authorId) {
            if (!window.currentUser) { switchView('auth'); return; }
            const amount = parseInt(prompt("Nhập số xu muốn tặng tác giả:", "10"));
            if (!amount || amount <= 0) return;
            if (window.currentProfile.username !== 'quanly' && window.currentProfile.coins < amount) {
                alert("Bạn không đủ xu để tặng!");
                return;
            }

            try {
                // Trừ xu người tặng (trừ khi là quản lý)
                if (window.currentProfile.username !== 'quanly') {
                    window.currentProfile.coins -= amount;
                    await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });
                }
                // Cộng xu và thu nhập cho tác giả
                const authorRef = window.doc(window.db, "users", authorId);
                const authorSnap = await window.getDoc(authorRef);
                if (authorSnap.exists()) {
                    const authorData = authorSnap.data();
                    await window.updateDoc(authorRef, { coins: (authorData.coins || 0) + amount });
                }
                const storyRef = window.doc(window.db, "stories", storyId);
                const storySnap = await window.getDoc(storyRef);
                if (storySnap.exists()) {
                    const sData = storySnap.data();
                    await window.updateDoc(storyRef, { collectedCoins: (sData.collectedCoins || 0) + amount });
                }
                alert("🎉 Tặng xu thành công!");
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        async function postComment(e, storyId) {
            e.preventDefault();
            if (!window.currentUser) { switchView('auth'); return; }
            const text = document.getElementById('commentInput').value.trim();
            if (!text) return;

            try {
                await window.addDoc(window.collection(window.db, "stories", storyId, "comments"), {
                    authorId: window.currentUser.uid,
                    authorName: window.currentProfile.displayName || window.currentProfile.username,
                    text: text,
                    createdAt: window.serverTimestamp()
                });
                document.getElementById('commentInput').value = '';
                renderReadStoryPage(storyId);
            } catch(err) { alert("Lỗi: " + err.message); }
        }

        async function deleteComment(storyId, commentId) {
            if (!confirm("Xóa bình luận này?")) return;
            try {
                await window.deleteDoc(window.doc(window.db, "stories", storyId, "comments", commentId));
                renderReadStoryPage(storyId);
            } catch(e) { alert("Lỗi: " + e.message); }
        }

                                </h2>
                                <p class="text-xs text-gray-400">Cấp bậc: ${getRankName(author.reputation)} | Độ nổi tiếng: ${author.reputation}</p>
                                <button onclick="donateAuthorDirect('${authorId}')" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">
                                    <i class="fas fa-coins mr-1"></i> Tặng Xu Cho Tác Giả
                                </button>
                            </div>
                        </div>

                        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 space-y-4">
                            <h3 class="text-xl font-bold text-purple-300">Tác phẩm của ${author.displayName || author.username}</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${storiesHtml || '<p class="text-gray-400 text-sm">Chưa có tác phẩm nào.</p>'}</div>
                        </div>
                    </div>
                `;
            } catch(e) {
                content.innerHTML = `<p class="text-center py-8 text-red-400">Lỗi: ${e.message}</p>`;
            }
        }

        async function donateAuthorDirect(authorId) {
            if (!window.currentUser) { switchView('auth'); return; }
            const amount = parseInt(prompt("Nhập số xu muốn tặng:", "10"));
            if (!amount || amount <= 0) return;
            if (window.currentProfile.username !== 'quanly' && window.currentProfile.coins < amount) {
                alert("Bạn không đủ xu!");
                return;
            }

            try {
                if (window.currentProfile.username !== 'quanly') {
                    window.currentProfile.coins -= amount;
                    await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), { coins: window.currentProfile.coins });
                }
                const authorRef = window.doc(window.db, "users", authorId);
                const aSnap = await window.getDoc(authorRef);
                if (aSnap.exists()) {
                    await window.updateDoc(authorRef, { coins: (aSnap.data().coins || 0) + amount });
                }
                alert("Tặng xu thành công!");
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        // --- Mục Xu & Đổi Danh Tiếng ---
        function renderCoinsPage() {
            if (!window.currentUser) { switchView('auth'); return; }
            const p = window.currentProfile;
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 space-y-6 text-center">
                    <h2 class="text-2xl font-bold text-yellow-400"><i class="fas fa-coins mr-2"></i> Kho Xu & Danh Tiếng</h2>
                    <div class="bg-gray-700 p-4 rounded-xl">
                        <p class="text-xs text-gray-400">Số xu hiện có</p>
                        <p class="text-3xl font-extrabold text-yellow-400">${p.coins} Xu</p>
                    </div>
                    <div class="bg-gray-700 p-4 rounded-xl">
                        <p class="text-xs text-gray-400">Độ nổi tiếng hiện tại</p>
                        <p class="text-3xl font-extrabold text-purple-400">${p.reputation}</p>
                    </div>
                    <div class="space-y-3 pt-2">
                        <button onclick="exchangeCoinsToReputation()" class="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-700 hover:to-amber-700 text-white font-bold py-3 rounded-xl transition">
                            Đổi 10 Xu lấy 1 Độ Nổi Tiếng (Tối đa 5 lần/ngày)
                        </button>
                    </div>
                </div>
            `;
        }

        async function exchangeCoinsToReputation() {
            const p = window.currentProfile;
            const today = new Date().toDateString();
            if (p.lastExchangeDate !== today) {
                p.dailyCoinExchanges = 0;
                p.lastExchangeDate = today;
            }
            if (p.dailyCoinExchanges >= 5) {
                alert("Bạn đã đạt giới hạn đổi 5 lần trong ngày!");
                return;
            }
            if (p.username !== 'quanly' && p.coins < 10) {
                alert("Bạn cần ít nhất 10 xu để đổi!");
                return;
            }

            try {
                if (p.username !== 'quanly') p.coins -= 10;
                p.reputation += 1;
                p.dailyCoinExchanges += 1;

                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    coins: p.coins,
                    reputation: p.reputation,
                    dailyCoinExchanges: p.dailyCoinExchanges,
                    lastExchangeDate: p.lastExchangeDate
                });
                alert("Đổi thành công! Nhận thêm 1 độ nổi tiếng.");
                renderCoinsPage();
                renderNavbar();
            } catch(e) { alert("Lỗi: " + e.message); }
        }

        // --- Gửi Thư Giữa Các Tài Khoản (Chữ, Ảnh, Ghi âm) ---
        async function renderMessagesPage() {
            if (!window.currentUser) { switchView('auth'); return; }
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 space-y-6">
                    <h2 class="text-2xl font-bold text-purple-400 border-b border-gray-700 pb-3"><i class="fas fa-envelope mr-2"></i> Hộp Thư Tín</h2>
                    
                    <form onsubmit="sendMessage(event)" class="space-y-4 bg-gray-700/50 p-4 rounded-xl border border-gray-600">
                        <h3 class="text-sm font-bold text-white">Gửi thư mới</h3>
                        <div>
                            <input type="text" id="msgReceiver" required placeholder="Tên đăng nhập người nhận..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs">
                        </div>
                        <div>
                            <textarea id="msgText" rows="2" placeholder="Nội dung chữ..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="url" id="msgImg" placeholder="Link ảnh (URL)..." class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs">
                            <input type="url" id="msgAudio" placeholder="Link ghi âm (Audio URL)..." class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs">
                        </div>
                        <button type="submit" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-xs font-bold text-white">Gửi Thư</button>
                    </form>

                    <div id="messagesListContainer" class="space-y-3">
                        <p class="text-gray-400 text-sm">Đang tải hộp thư...</p>
                    </div>
                </div>
            `;
            loadMessages();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const receiverUsername = document.getElementById('msgReceiver').value.trim().toLowerCase();
            const text = document.getElementById('msgText').value.trim();
            const imageUrl = document.getElementById('msgImg').value.trim();
            const audioUrl = document.getElementById('msgAudio').value.trim();

            try {
                const q = window.query(window.collection(window.db, "users"), window.where("username", "==", receiverUsername));
                const snap = await window.getDocs(q);
                if (snap.empty) {
                    alert("Không tìm thấy người nhận!");
                    return;
                }
                let receiverUid = '';
                snap.forEach(d => receiverUid = d.id);

                await window.addDoc(window.collection(window.db, "messages"), {
                    senderId: window.currentUser.uid,
                    senderName: window.currentProfile.displayName || window.currentProfile.username,
                    receiverId: receiverUid,
                    text, imageUrl, audioUrl,
                    createdAt: window.serverTimestamp()
                });
                alert("Gửi thư thành công!");
                renderMessagesPage();
            } catch(err) { alert("Lỗi: " + err.message); }
        }

        async function loadMessages() {
            const container = document.getElementById('messagesListContainer');
            try {
                const q = window.query(window.collection(window.db, "messages"), window.where("receiverId", "==", window.currentUser.uid));
                const snap = await window.getDocs(q);
                if (snap.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-sm">Hộp thư trống.</p>`;
                    return;
                }
                let html = '';
                snap.forEach(docSnap => {
                    const m = docSnap.data();
                    html += `
                        <div class="bg-gray-700 p-4 rounded-xl border border-gray-600 space-y-2">
                            <div class="flex justify-between">
                                <span class="font-bold text-purple-300 text-xs">Từ: ${m.senderName}</span>
                            </div>
                            ${m.text ? `<p class="text-sm text-gray-200">${m.text}</p>` : ''}
                            ${m.imageUrl ? `<img src="${m.imageUrl}" class="max-h-40 rounded-lg object-cover">` : ''}
                            ${m.audioUrl ? `<audio controls class="w-full h-8"><source src="${m.audioUrl}"></audio>` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) { container.innerHTML = `<p class="text-red-400 text-sm">Lỗi tải thư.</p>`; }
        }

        // --- Bảng Điều Khiển Quản Lý (Admin Panel) ---
        function renderAdminPanel() {
            if (!window.currentUser || window.currentProfile.username !== 'quanly') {
                alert("Bạn không có quyền truy cập!");
                switchView('home');
                return;
            }
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-3xl mx-auto bg-gray-800 p-8 rounded-2xl shadow-xl border border-red-500 space-y-6">
                    <h2 class="text-2xl font-bold text-red-500 border-b border-gray-700 pb-3"><i class="fas fa-shield-alt mr-2"></i> Bảng Điều Khiển Quản Lý</h2>
                    
                    <form onsubmit="handleUpdateSystemConfig(event)" class="space-y-4 bg-gray-700/50 p-4 rounded-xl border border-gray-600">
                        <h3 class="font-bold text-white text-sm">Cài đặt giao diện & Thông báo hệ thống</h3>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Nội dung thanh thông báo</label>
                            <input type="text" id="adminNotifText" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs" value="📢 Chào mừng bạn đến với Truyện hay Gn!">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Màu nền thanh thông báo (Class Tailwind hoặc màu HEX)</label>
                            <input type="text" id="adminNotifBg" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs" value="bg-indigo-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Hình nền trang web (URL)</label>
                            <input type="url" id="adminWebBg" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-xs" placeholder="https://...">
                        </div>
                        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-xs">Áp dụng hệ thống</button>
                    </form>
                </div>
            `;
        }

        function handleUpdateSystemConfig(e) {
            e.preventDefault();
            const text = document.getElementById('adminNotifText').value;
            const bgClass = document.getElementById('adminNotifBg').value;
            const webBgUrl = document.getElementById('adminWebBg').value;

            document.getElementById('notificationText').innerText = text;
            const bar = document.getElementById('systemNotificationBar');
            bar.className = `${bgClass} text-white px-4 py-2 text-center text-sm font-medium shadow-md transition-all duration-300 flex justify-between items-center`;

            if (webBgUrl) {
                document.getElementById('mainBody').style.backgroundImage = `url('${webBgUrl}')`;
                document.getElementById('mainBody').style.backgroundSize = 'cover';
            }
            alert("Đã cập nhật hệ thống thành công!");
        }

        function closeNotificationBar() {
            document.getElementById('systemNotificationBar').style.display = 'none';
        }
    </script>
</body>
</html>
