<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện hay Gn</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes bronzeGlow { 0% { text-shadow: 0 0 5px #cd7f32; } 50% { text-shadow: 0 0 15px #cd7f32; } 100% { text-shadow: 0 0 5px #cd7f32; } }
        @keyframes silverGlow { 0% { text-shadow: 0 0 5px #c0c0c0; } 50% { text-shadow: 0 0 15px #ffffff; } 100% { text-shadow: 0 0 5px #c0c0c0; } }
        @keyframes goldGlow { 0% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } 50% { text-shadow: 0 0 20px #ffae00; transform: scale(1.02); } 100% { text-shadow: 0 0 5px #ffd700; transform: scale(1); } }
        @keyframes diamondGlow { 0% { text-shadow: 0 0 5px #00ffff; } 50% { text-shadow: 0 0 20px #0088ff; } 100% { text-shadow: 0 0 5px #00ffff; } }
        @keyframes legendGlow { 0% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } 33% { color: #00ff00; text-shadow: 0 0 8px #00ff00; } 66% { color: #0088ff; text-shadow: 0 0 8px #0088ff; } 100% { color: #ff0000; text-shadow: 0 0 8px #ff0000; } }

        .badge-dong { animation: bronzeGlow 2s infinite; color: #cd7f32; font-weight: bold; }
        .badge-bac { animation: silverGlow 2s infinite; color: #e0e0e0; font-weight: bold; }
        .badge-vang { animation: goldGlow 2s infinite; color: #ffd700; font-weight: bold; }
        .badge-kimcuong { animation: diamondGlow 2s infinite; color: #00ffff; font-weight: bold; }
        .badge-huyen-thoai { animation: legendGlow 3s infinite; font-weight: bold; }
        
        .comic-image-container img {
            display: block;
            margin: 0;
            padding: 0;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body id="mainBody" class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Thanh Thông Báo Hệ Thống -->
    <div id="systemNotificationBar" class="bg-indigo-600 text-white px-4 py-2 text-center text-sm font-medium shadow-md transition-all duration-300 flex justify-between items-center">
        <div id="notificationText" class="w-full truncate">📢 Chào mừng bạn đến với Truyện hay Gn! Đọc và sáng tác truyện đa thiết bị mượt mà.</div>
        <button onclick="closeNotificationBar()" class="text-white hover:text-gray-200 ml-4"><i class="fas fa-times"></i></button>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="backBtn" onclick="goBack()" class="hidden bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                    <i class="fas fa-arrow-left"></i> <span>Quay lại</span>
                </button>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent cursor-pointer" onclick="switchView('home')">Truyện hay Gn</h1>
            </div>

            <!-- Thanh tìm kiếm nhanh -->
            <div class="hidden md:flex items-center space-x-2 bg-gray-700 rounded-lg px-3 py-1.5 w-1/3">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="globalSearchInput" placeholder="Tìm tên truyện, thể loại, hoặc tên tác giả..." class="bg-transparent border-none focus:outline-none text-sm w-full text-white" oninput="handleGlobalSearch(this.value)">
            </div>

            <div class="flex items-center space-x-4" id="authNavSection">
                <!-- Nội dung hiển thị dựa vào trạng thái đăng nhập -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4" id="appMainContent">
        <!-- Khu vực hiển thị động nội dung ứng dụng -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-sm text-gray-400">
        <p>&copy; 2026 Truyện hay Gn - Nền tảng Sáng Tác & Đọc Truyện Đa Thiết Bị.</p>
    </footer>

    <!-- Firebase SDKs & App Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase dự án truyenhaygn của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyCnk_ubHwUVK_Z8EScWZufJSPnH4d0a9p8",
            authDomain: "truyenhaygn.firebaseapp.com",
            projectId: "truyenhaygn",
            storageBucket: "truyenhaygn.appspot.com",
            messagingSenderId: "608010144020",
            appId: "1:608010144020:web:3a7965447f7c74246bda01",
            measurementId: "G-JQ54X4X0C8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Biến lưu trạng thái cục bộ
        window.currentUser = null;
        window.currentProfile = null;
        window.currentView = 'home';
        window.historyStack = [];

        // Gắn các hàm Firebase Auth/Firestore vào window
        window.fbSignIn = signInWithEmailAndPassword;
        window.fbCreateUser = createUserWithEmailAndPassword;
        window.fbSignOut = signOut;
        window.db = db;
        window.auth = auth;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;

        // Khởi tạo ứng dụng kiểm tra đăng nhập
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    window.currentProfile = userSnap.data();
                } else {
                    const isQuanLy = user.email === 'quanly@storyverse.internal';
                    window.currentProfile = {
                        uid: user.uid,
                        username: isQuanLy ? 'quanly' : user.email.split('@')[0],
                        displayName: isQuanLy ? 'Quản Lý' : user.email.split('@')[0],
                        coins: isQuanLy ? 999999 : 50,
                        reputation: isQuanLy ? 2000000 : 0,
                        bgUrl: '',
                        role: isQuanLy ? 'admin' : 'author',
                        hearts: isQuanLy ? 2000000 : 0,
                        dailyCoinExchanges: 0,
                        lastExchangeDate: ''
                    };
                    await setDoc(userDocRef, window.currentProfile);
                }
            } else {
                window.currentUser = null;
                window.currentProfile = null;
            }
            renderNavbar();
            renderHome();
        });

        // --- Hàm xử lý Đăng nhập ---
        window.handleLoginSubmit = async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            let emailToUse = identifier;

            if (identifier === 'quanly') {
                emailToUse = 'quanly@storyverse.internal';
            } else if (!identifier.includes('@')) {
                emailToUse = identifier + '@storyverse.internal';
            }

            try {
                await window.fbSignIn(window.auth, emailToUse, pass);
                alert("Đăng nhập thành công!");
                switchView('home');
            } catch (err) {
                if (identifier === 'quanly' && (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) {
                    try {
                        const cred = await window.fbCreateUser(window.auth, emailToUse, pass);
                        const adminProfile = {
                            uid: cred.user.uid,
                            username: 'quanly',
                            displayName: 'Quản Lý',
                            coins: 999999,
                            reputation: 2000000,
                            bgUrl: '',
                            role: 'admin',
                            hearts: 2000000,
                            dailyCoinExchanges: 0,
                            lastExchangeDate: ''
                        };
                        await window.setDoc(window.doc(window.db, "users", cred.user.uid), adminProfile);
                        alert("Đã khởi tạo thành công tài khoản Quản Lý!");
                        switchView('home');
                        return;
                    } catch (createErr) {
                        alert("Lỗi khi tạo tài khoản quản lý: " + createErr.message);
                        return;
                    }
                }
                alert("Đăng nhập thất bại: " + err.message);
            }
        };

        // --- Hàm xử lý Đăng ký ---
        window.handleRegisterSubmit = async function(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const emailInput = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (username === 'quanly') {
                alert("Tên tài khoản này dành riêng cho Quản Lý!");
                return;
            }

            try {
                const q = window.query(window.collection(window.db, "users"), window.where("username", "==", username));
                const snap = await window.getDocs(q);
                if (!snap.empty) {
                    alert("Tên đăng nhập đã tồn tại! Vui lòng chọn tên khác.");
                    return;
                }

                const emailToUse = emailInput.includes('@') ? emailInput : username + '@storyverse.internal';
                const cred = await window.fbCreateUser(window.auth, emailToUse, pass);
                
                const userProfile = {
                    uid: cred.user.uid,
                    username: username,
                    displayName: username,
                    coins: 100,
                    reputation: 0,
                    bgUrl: '',
                    role: 'author',
                    hearts: 0,
                    dailyCoinExchanges: 0,
                    lastExchangeDate: ''
                };
                await window.setDoc(window.doc(window.db, "users", cred.user.uid), userProfile);
                alert("Đăng ký tài khoản thành công!");
                switchView('home');
            } catch (err) {
                alert("Đăng ký thất bại: " + err.message);
            }
        };

        // --- Hàm Đăng xuất ---
        window.handleLogout = async function() {
            await window.fbSignOut(window.auth);
            switchView('home');
        };
    </script>

    <!-- App View Logic Scripts -->
    <script>
        function switchView(viewName, params = {}) {
            window.historyStack.push({ view: window.currentView, params: window.currentParams || {} });
            window.currentView = viewName;
            window.currentParams = params;
            document.getElementById('backBtn').classList.remove('hidden');
            renderCurrentView();
        }

        function goBack() {
            if (window.historyStack.length > 0) {
                const prev = window.historyStack.pop();
                window.currentView = prev.view;
                window.currentParams = prev.params;
                if (window.historyStack.length === 0) {
                    document.getElementById('backBtn').classList.add('hidden');
                }
                renderCurrentView();
            }
        }

        function renderCurrentView() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = '';
            switch(window.currentView) {
                case 'home': renderHome(); break;
                case 'auth': renderAuthPage(); break;
                case 'studio': renderStudioPage(); break;
                case 'create-story': renderCreateStoryPage(); break;
                case 'read-story': renderReadStoryPage(window.currentParams.storyId); break;
                case 'author-profile': renderAuthorProfilePage(window.currentParams.authorId); break;
                case 'messages': renderMessagesPage(); break;
                case 'coins': renderCoinsPage(); break;
                case 'admin-panel': renderAdminPanel(); break;
                default: renderHome();
            }
        }

        function renderNavbar() {
            const nav = document.getElementById('authNavSection');
            if (!window.currentUser || !window.currentProfile) {
                nav.innerHTML = `
                    <button onclick="switchView('auth')" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition">Đăng nhập / Đăng ký</button>
                `;
            } else {
                const p = window.currentProfile;
                const isAdmin = p.username === 'quanly';
                nav.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <button onclick="switchView('coins')" class="bg-yellow-600/20 border border-yellow-500 text-yellow-400 px-3 py-1 rounded-full text-xs font-bold flex items-center space-x-1">
                            <i class="fas fa-coins"></i> <span>${p.coins} Xu</span>
                        </button>
                        <button onclick="switchView('messages')" class="relative text-gray-300 hover:text-white">
                            <i class="fas fa-envelope text-lg"></i>
                        </button>
                        <button onclick="switchView('studio')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                            <i class="fas fa-pen-nib mr-1"></i> Sáng tác
                        </button>
                        ${isAdmin ? `<button onclick="switchView('admin-panel')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm font-medium transition text-white">Quản Lý</button>` : ''}
                        <div class="flex items-center space-x-2 cursor-pointer" onclick="switchView('author-profile', {authorId: '${p.uid}'})">
                            <img src="${p.bgUrl || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover border border-purple-500">
                            <span class="text-sm font-semibold ${isAdmin ? 'text-red-500 font-bold' : getRankClass(p.reputation)}">${p.displayName || p.username} ${isAdmin ? '<i class="fas fa-check-circle text-blue-500 text-xs"></i>' : ''}</span>
                        </div>
                        <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                `;
            }
        }

        function getRankClass(reputation) {
            if (reputation >= 1000000) return 'badge-huyen-thoai';
            if (reputation >= 100000) return 'badge-kimcuong';
            if (reputation >= 10000) return 'badge-vang';
            if (reputation >= 1000) return 'badge-bac';
            if (reputation >= 100) return 'badge-dong';
            return 'text-gray-200';
        }

        function getRankName(reputation) {
            if (reputation >= 1000000) return 'Huyền thoại';
            if (reputation >= 100000) return 'Kim cương';
            if (reputation >= 10000) return 'Vàng';
            if (reputation >= 1000) return 'Bạc';
            if (reputation >= 100) return 'Đồng';
            return 'Tập sự';
        }

        async function renderHome() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-800 to-indigo-900 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-extrabold text-white mb-2">Khám Phá Thế Giới Truyện Tranh & Chữ</h2>
                            <p class="text-purple-200 text-sm">Đọc truyện mượt mà, đồng bộ hoàn hảo giữa điện thoại và máy tính.</p>
                        </div>
                        <button onclick="switchView('create-story')" class="mt-4 md:mt-0 bg-pink-600 hover:bg-pink-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition">Viết Truyện Ngay</button>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-4 text-purple-300">Tác phẩm đề xuất & nổi bật</h3>
                        <div id="storyListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <p class="text-gray-400">Đang tải danh sách tác phẩm...</p>
                        </div>
                    </div>
                </div>
            `;
            loadStories();
        }

        async function loadStories() {
            const container = document.getElementById('storyListContainer');
            try {
                const q = window.query(window.collection(window.db, "stories"), window.orderBy("hearts", "desc"));
                const querySnapshot = await window.getDocs(q);
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">Chưa có tác phẩm nào được đăng.</p>`;
                    return;
                }
                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const story = docSnap.data();
                    const sId = docSnap.id;
                    html += `
                        <div onclick="switchView('read-story', {storyId: '${sId}'})" class="bg-gray-800 rounded-xl overflow-hidden shadow-md hover:shadow-purple-500/20 transition cursor-pointer border border-gray-700 flex flex-col">
                            <div class="h-40 bg-cover bg-center" style="background-image: url('${story.coverUrl || 'https://via.placeholder.com/300'}')"></div>
                            <div class="p-4 flex flex-col flex-grow">
                                <span class="text-xs text-pink-400 font-semibold mb-1 uppercase">${story.genre} • ${story.type}</span>
                                <h4 class="text-lg font-bold text-white truncate">${story.title}</h4>
                                <p class="text-xs text-gray-400 mb-2">Tác giả: ${story.authorName}</p>
                                <p class="text-xs text-gray-300 line-clamp-2 mb-4 flex-grow">${story.description}</p>
                                <div class="flex justify-between items-center text-xs text-gray-400 border-t border-gray-700 pt-2">
                                    <span><i class="fas fa-heart text-red-500 mr-1"></i> ${story.hearts || 0}</span>
                                    <span><i class="fas fa-coins text-yellow-500 mr-1"></i> Thu nhập: ${story.collectedCoins || 0}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">Chưa có tác phẩm nào.</p>`;
            }
        }

        function renderAuthPage() {
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 mt-10">
                    <div class="flex border-b border-gray-700 mb-6">
                        <button onclick="toggleAuthTab('login')" id="loginTabBtn" class="w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500">Đăng Nhập</button>
                        <button onclick="toggleAuthTab('register')" id="registerTabBtn" class="w-1/2 pb-3 font-bold text-gray-400">Đăng Ký</button>
                    </div>
                    <div id="authFormContainer">
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                                <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                                <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function toggleAuthTab(tab) {
            const container = document.getElementById('authFormContainer');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');
            if (tab === 'login') {
                loginBtn.className = "w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500";
                regBtn.className = "w-1/2 pb-3 font-bold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập hoặc Email</label>
                            <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                            <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                    </form>
                `;
            } else {
                regBtn.className = "w-1/2 pb-3 font-bold text-purple-400 border-b-2 border-purple-500";
                loginBtn.className = "w-1/2 pb-3 font-bold text-gray-400";
                container.innerHTML = `
                    <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Tên đăng nhập (Duy nhất)</label>
                            <input type="text" id="regUsername" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Email</label>
                            <input type="email" id="regEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
                            <input type="password" id="regPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Ký</button>
                    </form>
                `;
            }
        }

        function renderStudioPage() {
            if (!window.currentUser) {
                switchView('auth');
                return;
            }
            const p = window.currentProfile;
            const content = document.getElementById('appMainContent');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 flex flex-col md:flex-row justify-between items-center">
                        <div class="flex items-center space-x-4">
                            <img src="${p.bgUrl || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full object-cover border-2 border-purple-500">
                            <div>
                                <h2 class="text-2xl font-bold ${p.username === 'quanly' ? 'text-red-500 font-bold' : getRankClass(p.reputation)}">${p.displayName || p.username}</h2>
                                <p class="text-xs text-gray-400">Cấp bậc: ${getRankName(p.reputation)} | Độ nổi tiếng: ${p.reputation} | Xu: ${p.coins}</p>
                            </div>
                        </div>
                        <div class="mt-4 md:mt-0 flex space-x-3">
                            <button onclick="switchView('create-story')" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-xl text-sm font-bold transition">Tạo Tác Phẩm Mới</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCreateStoryPage() { switchView('home'); }
        function renderReadStoryPage() { switchView('home'); }
        function renderAuthorProfilePage() { switchView('home'); }
        function renderMessagesPage() { switchView('home'); }
        function renderCoinsPage() { switchView('home'); }
        function renderAdminPanel() { switchView('home'); }

        function closeNotificationBar() {
            document.getElementById('systemNotificationBar').style.display = 'none';
        }
    </script>
</body>
